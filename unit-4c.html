<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 4 Student Review | The Legislative Branch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --green:#6C8B5F; --green-dark:#55744A; --green-deep:#38562D;
  --sage:#D9E3D0; --sage-light:#EDF3E8;
  --parchment:#F7F4EE; --paper:#FFFFFF; --ink:#2B2723; --muted:#6E655D;
  --line:#DED6C9; --gold:#F2E3C8;
  --right:#4F7A3F; --wrong:#A8443E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Lora',Georgia,serif;color:var(--ink);background:var(--parchment);
  -webkit-font-smoothing:antialiased;touch-action:manipulation}

/* ---------- rail ---------- */
.rail{position:fixed;top:0;left:0;right:0;height:62px;z-index:40;background:var(--green);
  color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:4px solid var(--green-deep)}
.rail .brand{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;font-size:clamp(.72rem,1.4vw,1rem);white-space:nowrap}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots button{width:28px;height:7px;border:none;border-radius:1px;cursor:pointer;
  background:rgba(255,255,255,.35);transition:background .2s;padding:0}
.dots button.done{background:var(--gold)}
.dots button.here{background:#fff}
.scorebox{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.04em;
  font-size:clamp(.88rem,1.7vw,1.15rem);white-space:nowrap;background:rgba(0,0,0,.16);padding:6px 13px}

/* ---------- track ---------- */
.viewport{position:fixed;top:62px;left:0;right:0;bottom:0;overflow:hidden}
.track{display:flex;height:100%;transition:transform .45s cubic-bezier(.4,0,.2,1)}
.panel{flex:0 0 100%;height:100%;display:flex;flex-direction:column;align-items:center;
  padding:16px clamp(14px,3vw,40px) 12px;overflow:hidden}
.panel-inner{width:100%;max-width:1120px;display:flex;flex-direction:column;height:100%}
.sec-tag{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.14em;
  font-size:.72rem;color:var(--green-dark);margin-bottom:3px}
h2{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.02em;
  line-height:1.05;color:var(--green-deep);font-size:clamp(1.2rem,2.8vw,1.9rem)}
.dashes{display:flex;gap:7px;margin:7px 0 9px}
.dashes span{width:20px;height:4px;background:var(--green);border-radius:1px}
.prompt{font-size:clamp(.82rem,1.5vw,.98rem);color:var(--muted);margin-bottom:10px;line-height:1.45}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:9px}

/* ---------- mcq ---------- */
.q{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--green);
  padding:clamp(8px,1.4vw,13px) clamp(10px,1.6vw,16px)}
.q .qt{font-size:clamp(.82rem,1.5vw,1rem);line-height:1.4;margin-bottom:8px}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.03em;
  font-size:clamp(.7rem,1.25vw,.86rem);text-transform:uppercase;background:var(--sage-light);
  border:1.5px solid var(--sage);color:var(--green-deep);padding:8px 13px;cursor:pointer;
  transition:background .14s,transform .1s;text-align:center;flex:1 1 auto}
.opt:hover:not(:disabled){background:var(--sage);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--right);border-color:var(--right);color:#fff}
.opt.chosen-wrong{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt:focus-visible,.card:focus-visible,.step:focus-visible{outline:3px solid var(--green-dark);outline-offset:2px}
.fb{font-size:.78rem;font-style:italic;color:var(--green-deep);margin-top:6px;display:none;line-height:1.4}
.fb.show{display:block}

/* ---------- draggable cards ---------- */
.pool{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:flex-start;
  min-height:46px;margin-bottom:4px}
.card{font-family:'Lora',Georgia,serif;font-size:clamp(.72rem,1.25vw,.85rem);line-height:1.3;
  background:var(--paper);border:1.5px solid var(--line);border-top:4px solid var(--green);
  color:var(--ink);padding:7px 10px;cursor:grab;text-align:left;max-width:210px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);user-select:none;-webkit-user-select:none;
  touch-action:none;transition:box-shadow .12s}
.card.term{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;
  font-weight:600;font-size:clamp(.74rem,1.3vw,.9rem);color:var(--green-deep)}
.card:hover:not(.placed){box-shadow:0 3px 8px rgba(0,0,0,.14)}
.card.dragging{cursor:grabbing;z-index:60;position:relative;box-shadow:0 10px 22px rgba(0,0,0,.26);opacity:.95}
.card.selected{border-color:var(--green-dark);box-shadow:0 0 0 3px var(--sage)}
/* pointer-events:none matters. A placed card is a disabled button, and Chrome
   swallows clicks on those, so once a box filled up, tapping it to drop the next
   card stopped registering. Letting clicks pass through to the box fixes it. */
.card.placed{cursor:default;box-shadow:none;max-width:none;width:100%;padding:6px 9px;pointer-events:none}
.card.ok{border-top-color:var(--right);background:#F2F7EF}
.card.no{border-top-color:var(--wrong);background:#FAF0EF}
.card .verdict{font-family:'Oswald',sans-serif;font-size:.6rem;text-transform:uppercase;
  letter-spacing:.08em;display:block;margin-top:3px}
.card.ok .verdict{color:var(--right)}
.card.no .verdict{color:var(--wrong)}
.card .why{display:block;font-style:italic;color:var(--muted);font-size:.7rem;margin-top:2px;
  line-height:1.35;font-family:'Lora',Georgia,serif;font-weight:400;text-transform:none;letter-spacing:0}

/* ---------- chamber boxes ---------- */
.dd-boxes{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vw,22px);flex:1;min-height:0}
.box{border:2.5px dashed var(--sage);background:rgba(255,255,255,.55);padding:8px;
  display:flex;flex-direction:column;gap:5px;transition:background .14s,border-color .14s;min-height:0}
.box.hot{border-color:var(--green);background:var(--sage-light)}
.box h3{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  font-size:clamp(.82rem,1.6vw,1.05rem);color:var(--green-deep);text-align:center;
  border-bottom:2px solid var(--sage);padding-bottom:4px;flex:0 0 auto}
.box-list{display:flex;flex-direction:column;gap:5px;overflow-y:auto;min-height:0}

/* ---------- bill chart ---------- */
.chart{display:flex;flex-direction:column;gap:6px;min-height:0}
.phases{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.phase{background:var(--green-deep);color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:.06em;font-size:clamp(.56rem,.88vw,.76rem);text-align:center;padding:4px 2px;font-weight:600}
.phase.pslot{background:rgba(56,86,45,.1);border:2px dashed var(--green-deep);color:var(--green-deep);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:38px;
  transition:background .14s,border-color .14s}
.phase.pslot .pn{font-size:.82em;opacity:.75}
.phase.pslot .pv{font-weight:700;color:#A9A096;font-size:.95em;line-height:1.15}
.phase.pslot.hot{background:rgba(56,86,45,.35);border-style:solid}
.phase.pslot.ok{background:var(--green-deep);border-style:solid;color:#fff}
.phase.pslot.ok .pv{color:#fff}
.phase.pslot.no{background:#F8EDEC;border-style:solid;border-color:var(--wrong);color:var(--wrong)}
.phase.pslot.no .pv{color:var(--wrong)}
.phase.pslot .corr{display:block;font-family:'Lora',Georgia,serif;font-style:italic;font-weight:400;
  text-transform:none;letter-spacing:0;font-size:.92em;color:var(--green-deep);margin-top:1px}
.card.phase-card{background:var(--green-deep);color:#fff;border:1.5px solid var(--green-deep);
  border-top:4px solid var(--gold);font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:.06em;font-weight:600}
.card.phase-card:hover:not(.placed){background:var(--green-dark);border-color:var(--green-dark)}
/* stages: one question or one map at a time */
.stage[hidden]{display:none}
/* one question on screen at a time, so it can be read from across the room:
   bigger type and the four choices stacked one per row */
.stage.big .q{padding:clamp(14px,2vw,22px) clamp(16px,2.2vw,26px)}
.stage.big .qt{font-size:clamp(1.02rem,2.1vw,1.45rem);line-height:1.35;margin-bottom:clamp(10px,1.6vw,16px)}
.stage.big .opts{flex-direction:column;gap:clamp(6px,1vw,10px)}
.stage.big .opt{width:100%;flex:0 0 auto;text-align:left;
  font-family:'Lora',Georgia,serif;text-transform:none;letter-spacing:0;font-weight:400;
  font-size:clamp(.86rem,1.55vw,1.1rem);padding:clamp(9px,1.4vw,14px) clamp(13px,1.8vw,20px);line-height:1.35}
.stage.big .fb{font-size:clamp(.82rem,1.3vw,.95rem);margin-top:clamp(8px,1.2vw,12px)}
/* map stages: stack the choices too, but keep the map the hero */
.stage.stack .opts{flex-direction:column;gap:6px}
.stage.stack .opt{width:100%;flex:0 0 auto;text-align:left;
  font-family:'Lora',Georgia,serif;text-transform:none;letter-spacing:0;font-weight:400;
  font-size:clamp(.8rem,1.4vw,1rem);padding:9px 15px;line-height:1.35}
.stage.stack .mapwrap img{max-height:32vh}
.stagetag{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.1em;
  font-size:.68rem;color:var(--green-dark);margin-bottom:7px}
.stagenav{display:flex;justify-content:center;padding-top:10px}
.steps{display:grid;grid-template-columns:repeat(10,1fr);grid-auto-rows:1fr;gap:5px;min-height:0}
.stepbox{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--green);
  padding:5px 4px;display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden}
.stepbox .n{font-family:'Oswald',sans-serif;font-size:.62rem;font-weight:700;color:#fff;
  background:var(--green);width:17px;height:17px;flex:0 0 17px;
  display:flex;align-items:center;justify-content:center}
.stepbox .st{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.01em;
  font-size:clamp(.56rem,.88vw,.74rem);color:var(--green-deep);font-weight:600;line-height:1.15}
.stepbox .pre{font-size:clamp(.52rem,.8vw,.68rem);color:var(--muted);line-height:1.3}
.slot2{margin-top:auto;border:2px dashed var(--sage);background:var(--sage-light);min-height:32px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px 3px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(.54rem,.84vw,.7rem);color:#A9A096;line-height:1.15;
  transition:background .14s,border-color .14s}
.slot2.hot{border-color:var(--green-deep);border-style:solid;background:rgba(108,139,95,.3)}
.slot2.ok{border-style:solid;border-color:var(--right);background:#E8F1E4;color:var(--green-deep);font-weight:600}
.slot2.no{border-style:solid;border-color:var(--wrong);background:#F8EDEC;color:var(--wrong);font-weight:600}
.slot2 .corr{display:block;width:100%;font-family:'Lora',Georgia,serif;font-style:italic;font-weight:400;
  text-transform:none;letter-spacing:0;color:var(--green-deep);font-size:.92em;line-height:1.2;margin-top:3px}
#fb-bill{min-height:34px}

/* ---------- face targets ---------- */
.photowrap{position:relative;display:inline-block;line-height:0}
.photowrap img{display:block;max-height:30vh;width:auto;max-width:100%;
  border:1px solid var(--line);background:var(--paper)}
.face{position:absolute;top:2%;height:96%;border:2.5px dashed rgba(108,139,95,.6);
  background:rgba(255,255,255,.08);border-radius:3px;transition:border-color .14s,background .14s}
.face.hot{border-color:var(--green-deep);border-style:solid;background:rgba(108,139,95,.26)}
.face.ok{border-color:var(--right);border-style:solid;background:rgba(79,122,63,.14)}
.face.no{border-color:var(--wrong);border-style:solid;background:rgba(168,68,62,.14)}
.face .drops{position:absolute;left:3px;right:3px;bottom:4px;
  display:flex;flex-direction:column;gap:2px;align-items:center;line-height:1.25}
.chip2{font-family:'Oswald',sans-serif;font-size:clamp(.5rem,.78vw,.63rem);text-transform:uppercase;
  letter-spacing:.03em;color:#fff;padding:2px 6px;text-align:center;max-width:100%}
.chip2.ok{background:var(--right)}
.chip2.no{background:var(--wrong)}
.face.used{border-style:solid;border-color:var(--green-dark)}
#fb-faces{max-height:17vh;overflow-y:auto}
#fb-faces div{margin-bottom:3px}

/* ---------- washington map ---------- */
.wawrap{position:relative;display:inline-block;line-height:0}
.wawrap img{display:block;max-height:34vh;width:auto;max-width:100%;border:1px solid var(--line)}
.hs{position:absolute;background:rgba(255,255,255,.1);border:3px dashed rgba(43,39,35,.6);
  border-radius:50%;transition:border-color .15s,background .15s;animation:pulse 2.6s ease-in-out infinite}
.hs.hot{animation:none;border-style:solid;border-color:var(--green-deep);background:rgba(108,139,95,.3)}
.hs.full{animation:none;border-style:solid;border-color:var(--green-deep);background:rgba(108,139,95,.16)}
.hs .pin{position:absolute;left:50%;top:-11px;transform:translateX(-50%);
  font-family:'Oswald',sans-serif;font-size:.66rem;font-weight:700;letter-spacing:.08em;
  color:#fff;background:var(--green-deep);padding:2px 9px;white-space:nowrap;line-height:1.5}
@keyframes pulse{0%,100%{border-color:rgba(43,39,35,.5)}50%{border-color:rgba(108,139,95,.95)}}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.6vw,18px);flex:1;min-height:0}
.area{border:2px solid var(--sage);background:rgba(255,255,255,.6);padding:7px;
  display:flex;flex-direction:column;gap:5px;min-height:0}
.area h3{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  font-size:clamp(.76rem,1.4vw,.95rem);color:var(--green-deep);text-align:center;
  border-bottom:2px solid var(--sage);padding-bottom:4px}
.area-list{display:flex;flex-direction:column;gap:5px;overflow-y:auto;min-height:0}

/* ---------- ks map ---------- */
.mapwrap{text-align:center;margin-bottom:8px}
.mapwrap img{max-width:100%;max-height:38vh;border:1px solid var(--line);background:var(--paper);padding:3px}

/* ---------- nav ---------- */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:9px}
.btn{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  font-size:clamp(.76rem,1.4vw,.95rem);border:none;padding:11px 26px;cursor:pointer;
  background:var(--green);color:#fff;transition:background .15s}
.btn:hover:not(:disabled){background:var(--green-dark)}
.btn.ghost{background:transparent;color:var(--green-dark);border:1.5px solid var(--sage)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.counter{font-family:'Oswald',sans-serif;font-size:.78rem;color:var(--muted);letter-spacing:.05em}

/* ---------- start + finish ---------- */
.center{justify-content:center;text-align:center;align-items:center}
/* the Capitol sits behind the title page as a watermark. multiply drops the
   white paper out, so no transparent PNG is needed and the file stays small.
   .panel.start needs its own background: the track is a stacking context, and
   without a backdrop to blend against the white box lightens the parchment
   instead of vanishing. */
.panel.start{position:relative;background:var(--parchment)}
.panel.start::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:var(--capitol) center 60% / auto 84% no-repeat;
  mix-blend-mode:multiply;opacity:.16;
}
.panel.start .panel-inner{position:relative;z-index:1}
.btn.big-start{
  margin-top:clamp(14px,2.4vw,26px);
  font-size:clamp(1rem,2vw,1.4rem);
  padding:clamp(15px,2vw,22px) clamp(48px,7vw,88px);
  letter-spacing:.12em;
  box-shadow:0 3px 0 var(--green-deep);
}
.btn.big-start:hover{box-shadow:0 2px 0 var(--green-deep);transform:translateY(1px)}
.center h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:clamp(1.6rem,4.5vw,3rem);color:var(--green-deep);line-height:1.05}
.center p{max-width:640px;font-size:clamp(.88rem,1.7vw,1.05rem);line-height:1.55;color:var(--muted)}
.bigscore{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(3rem,10vw,6rem);
  color:var(--green);line-height:1}
.breakdown{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:780px}
.chip{font-family:'Oswald',sans-serif;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;
  background:var(--sage-light);border:1px solid var(--sage);padding:6px 11px;color:var(--green-deep)}

@media (max-height:800px){
  .q{padding:7px 11px}.q .qt{margin-bottom:6px}.body{gap:7px}
  .prompt{margin-bottom:8px}.dashes{margin:5px 0 7px}.opt{padding:6px 11px}
  .fb{margin-top:5px;font-size:.74rem}.panel{padding-top:11px;padding-bottom:9px}
  .nav{padding-top:6px}.mapwrap img{max-height:31vh}
  .stage.stack .mapwrap img{max-height:27vh}
  .wawrap img{max-height:30vh}.photowrap img{max-height:25vh}
  .pool{min-height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div class="rail">
  <div class="brand">Unit 4 &nbsp;/&nbsp; The Legislative Branch</div>
  <div class="dots" id="dots"></div>
  <div class="scorebox"><span id="score">0</span> / <span id="total">26</span></div>
</div>

<div class="viewport"><div class="track" id="track"></div></div>

<script>
/* =========================================================
   CONTENT - traceable to the Unit 4 slide deck
   ========================================================= */

// a staged section shows one question (or one map) at a time; flatten the
// stages into a single items list so every other helper keeps working
SECTIONS.forEach(sec=>{
  if(!sec.stages) return;
  let k=0;
  sec.stages.forEach(st=>{ st.from=k; k+=st.items.length; st.to=k; });
  sec.items = sec.stages.flatMap(st=>st.items);
});

// Shuffle the choices on every load. Written out, the right answer kept landing
// first, which is a pattern students pick up on fast. Reshuffling also means a
// second run through is not the same test as the first.
function shuffleOpts(it){
  if(!it || !it.opts) return;
  const right = it.opts[it.a];
  for(let i=it.opts.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [it.opts[i],it.opts[j]]=[it.opts[j],it.opts[i]];
  }
  it.a = it.opts.indexOf(right);
}
SECTIONS.forEach(sec=>(sec.items||[]).forEach(shuffleOpts));

const TOTAL = SECTIONS.reduce((n,s)=>n+s.pts,0);

/* =========================================================
   STATE
   ========================================================= */
let page = 0, score = 0;
const sectionScore = {}; SECTIONS.forEach(s=>sectionScore[s.id]=0);
const answered = {};

/* =========================================================
   RENDER
   ========================================================= */
const track = document.getElementById('track');

function mcqBlocks(sec, offset){
  return sec.items.map((it,qi)=>
    `<div class="q"><div class="qt">${(offset||0)+qi+1}. ${it.q}</div>
      <div class="opts">${it.opts.map((o,oi)=>
        `<button class="opt" data-s="${sec.id}" data-q="${qi}" data-o="${oi}">${o}</button>`).join('')}</div>
      <div class="fb" id="fb-${sec.id}-${qi}">${it.fb}</div></div>`).join('');
}

function poolHTML(sec){
  return `<div class="pool" id="pool-${sec.id}">${sec.cards.map((c,i)=>
    `<button class="card${c.term?' term':''}${c.phase?' phase-card':''}" data-g="${sec.id}" data-card="${i}">${c.t}</button>`).join('')}</div>`;
}

function panelHTML(sec, idx){
  let body='';

  if(sec.type==='mcq'){
    if(sec.stages){
      body = sec.stages.map((st,si)=>
        `<div class="stage${sec.bigq?' big':''}${sec.stackOpts?' stack':''}" data-sg="${sec.id}" data-stage="${si}"${si?' hidden':''}>
           <div class="stagetag">${st.tag || `${sec.label||'Question'} ${si+1} of ${sec.stages.length}`}</div>
           ${st.img?`<div class="mapwrap"><img src="${IMG[st.img]}" alt="${st.alt||''}"></div>`:''}
           ${st.items.map((it,j)=>{const qi=st.from+j;
             return `<div class="q"><div class="qt">${it.q}</div>
               <div class="opts">${it.opts.map((o,oi)=>
                 `<button class="opt" data-s="${sec.id}" data-q="${qi}" data-o="${oi}">${o}</button>`).join('')}</div>
               <div class="fb" id="fb-${sec.id}-${qi}">${it.fb}</div></div>`;}).join('')}
           ${si<sec.stages.length-1?`<div class="stagenav"><button class="btn stage-next" data-sg="${sec.id}" data-go-stage="${si+1}" hidden>Continue</button></div>`:''}
         </div>`).join('');
    } else {
      body = mcqBlocks(sec);
    }

  } else if(sec.type==='chart'){
    body = `<div class="chart">
      <div class="phases">${sec.phases.map(p=>
        `<div class="phase pslot dropzone" data-g="${sec.id}" data-t="${p.slot}" style="grid-column:span ${p.span}"><span class="pn">Phase ${p.n}</span><span class="pv">drop the phase name</span></div>`).join('')}</div>
      <div class="steps">${sec.steps.map(st=>
        `<div class="stepbox">
           <div class="n">${st.n}</div>
           <div class="st">${st.t}</div>
           <div class="pre">${st.pre}</div>
           ${st.slot?`<div class="slot2 dropzone" data-g="${sec.id}" data-t="${st.slot}">drop a term</div>`:''}
         </div>`).join('')}</div>
      </div>`
      + poolHTML(sec)
      + `<div class="fb" id="fb-bill">&nbsp;</div>`;

  } else if(sec.type==='boxes'){
    body = poolHTML(sec) + `<div class="dd-boxes">${sec.boxes.map(b=>
      `<div class="box dropzone" data-g="${sec.id}" data-t="${b.id}">
         <h3>${b.label}</h3><div class="box-list" id="list-${b.id}"></div></div>`).join('')}</div>`;

  } else if(sec.type==='faces'){
    body = `<div style="text-align:center"><div class="photowrap">
        <img src="${IMG.reps}" alt="Photographs of three members of Congress from Kansas">
        ${sec.faces.map(f=>`<div class="face dropzone" data-g="${sec.id}" data-t="${f.id}" style="left:${f.left};width:${f.width}"><div class="drops" id="drops-${f.id}"></div></div>`).join('')}
      </div></div>`
      + poolHTML(sec)
      + `<div class="fb" id="fb-faces"></div>`;

  } else if(sec.type==='hotspots'){
    body = `<div style="text-align:center"><div class="wawrap">
        <img src="${IMG.wa}" alt="Invented state map with orange and purple districts and clusters of voters">
        ${sec.spots.map(s=>`<div class="hs dropzone" data-g="${sec.id}" data-t="${s.id}" style="left:${s.left};top:${s.top};width:${s.width};height:${s.height}"><span class="pin" id="pin-${s.id}">${s.pin}</span></div>`).join('')}
      </div></div>`
      + poolHTML(sec)
      + `<div class="areas">${sec.spots.map(s=>
          `<div class="area"><h3 id="ah-${s.id}">Area ${s.pin}</h3><div class="area-list" id="list-${s.id}"></div></div>`).join('')}</div>`;
  }

    <div class="sec-tag">Section ${idx+1} of ${SECTIONS.length} &nbsp;/&nbsp; ${sec.pts} points</div>

    <div class="prompt">${sec.prompt}</div>
    <div class="body">${body}</div>
    <div class="nav">
      <button class="btn ghost" data-dir="-1">Back</button>
      <div class="counter" id="cnt-${sec.id}"></div>

track.innerHTML =
  `<div class="panel center start" style="--capitol:url('${IMG.capitol}')"><div class="panel-inner center">

const dots = document.getElementById('dots');
dots.innerHTML = SECTIONS.map((s,i)=>`<button data-jump="${i+1}" title="${s.title}" aria-label="Go to ${s.title}"></button>`).join('');

/* =========================================================
   MOVEMENT
   ========================================================= */
function cardsDone(sec){ return sec.cards.every((_,i)=>answered[sec.id+'-c'+i]); }
function itemsDone(sec){ return !sec.items || sec.items.every((_,qi)=>answered[sec.id+'-'+qi]); }
function sectionDone(sec){
  if(sec.cards) return cardsDone(sec) && itemsDone(sec);
  return itemsDone(sec);
}
function refreshDots(){
  dots.querySelectorAll('button').forEach((b,i)=>{
    b.classList.toggle('here', i+1===page);
    b.classList.toggle('done', sectionDone(SECTIONS[i]));
  });
}
function goTo(p){
  page = Math.max(0, Math.min(SECTIONS.length+1, p));
  track.style.transform = `translateX(-${page*100}%)`;
  refreshDots();
  if(page===SECTIONS.length+1) renderFinish();
}
function updateCounter(sec){
  const el=document.getElementById('cnt-'+sec.id); if(!el) return;
  const parts=[];
  if(sec.cards) parts.push(sec.cards.filter((_,i)=>answered[sec.id+'-c'+i]).length);
  if(sec.items) parts.push(sec.items.filter((_,qi)=>answered[sec.id+'-'+qi]).length);
  const done = parts.reduce((a,b)=>a+b,0);
  el.textContent = done<sec.pts ? `${done} of ${sec.pts} placed` : `${sectionScore[sec.id]} of ${sec.pts} points`;
}
SECTIONS.forEach(updateCounter);

function award(sid, correct){
  if(correct){ score++; sectionScore[sid]++; document.getElementById('score').textContent=score; }
}

document.addEventListener('click', e=>{
  const d=e.target.closest('[data-dir]'); if(d){ goTo(page + (+d.dataset.dir)); return; }
  const j=e.target.closest('[data-jump]'); if(j){ goTo(+j.dataset.jump); return; }
  if(e.target.id==='again') location.reload();
});
document.addEventListener('click', e=>{
  const sn = e.target.closest('.stage-next'); if(!sn) return;
  const sg = sn.dataset.sg, to = +sn.dataset.goStage;
  document.querySelectorAll(`.stage[data-sg="${sg}"]`).forEach(st=>{
    st.hidden = (+st.dataset.stage !== to);
  });
});

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='BUTTON' && (e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowRight') goTo(page+1);
  if(e.key==='ArrowLeft')  goTo(page-1);
});

/* =========================================================
   MULTIPLE CHOICE
   ========================================================= */
document.addEventListener('click', e=>{
  const opt=e.target.closest('.opt'); if(!opt) return;
  const sid=opt.dataset.s, qi=+opt.dataset.q, oi=+opt.dataset.o, key=sid+'-'+qi;
  if(answered[key]) return;
  answered[key]=true;
  const sec=SECTIONS.find(s=>s.id===sid), item=sec.items[qi];
  opt.parentElement.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true; if(i===item.a) b.classList.add('correct');
  });
  if(oi!==item.a) opt.classList.add('chosen-wrong'); else award(sid,true);
  document.getElementById('fb-'+key).classList.add('show');

  if(sec.stages){
    const st = sec.stages.find(g=>qi>=g.from && qi<g.to);
    const allDone = sec.items.slice(st.from,st.to).every((_,j)=>answered[sid+'-'+(st.from+j)]);
    const btn = document.querySelector(`.stage-next[data-sg="${sid}"][data-go-stage="${sec.stages.indexOf(st)+1}"]`);
    if(allDone && btn) btn.hidden = false;
    // last stage of a section flagged autoAdvance: slide on by itself, after a
    // beat long enough to read the feedback
    if(allDone && !btn && sec.autoAdvance){
      const home = SECTIONS.indexOf(sec)+1;
      setTimeout(()=>{ if(page===home) goTo(home+1); }, 2200);
    }
  }
  updateCounter(sec); refreshDots();
});

/* =========================================================
   DRAG AND DROP
   One engine for all three sections. Pointer events with a
   nearest-target search and a tolerance radius, because
   elementFromPoint alone is far too strict on small targets
   like a face or a circle on a map. Tap a card then tap a
   target works throughout, which is also the keyboard path.
   ========================================================= */
let drag=null, selected=null, startX=0, startY=0, moved=false, suppressClick=false;

function zonesFor(group){ return [...document.querySelectorAll(`.dropzone[data-g="${group}"]`)]; }

function nearestZone(x, y, group){
  let best=null, bestD=Infinity;
  const tol = Math.max(48, window.innerWidth*0.05);
  for(const z of zonesFor(group)){
    const r=z.getBoundingClientRect();
    if(!r.width) continue;
    const dx = x<r.left ? r.left-x : x>r.right  ? x-r.right  : 0;
    const dy = y<r.top  ? r.top -y : y>r.bottom ? y-r.bottom : 0;
    const d = Math.hypot(dx,dy);
    if(d<bestD){ bestD=d; best=z; }
  }
  return bestD<=tol ? best : null;
}

function setSelected(card){
  if(selected) selected.classList.remove('selected');
  selected = (selected===card) ? null : card;
  if(selected) selected.classList.add('selected');
}

function placeCard(card, zone){
  const gid=card.dataset.g, i=+card.dataset.card, key=gid+'-c'+i;
  if(answered[key]) return;
  const sec=SECTIONS.find(s=>s.id===gid), spec=sec.cards[i];
  const t=zone.dataset.t;
  const targets = Array.isArray(spec.target) ? spec.target : [spec.target];
  const correct = targets.includes(t);
  answered[key]=true;

  card.classList.remove('selected','dragging');
  card.style.transform='';
  card.disabled=true;
  award(gid, correct);

  if(sec.type==='chart'){
    // a filled slot stops being a target, so later cards land in open slots only
    zone.classList.remove('dropzone');
    zone.classList.add(correct?'ok':'no');
    if(spec.phase || zone.classList.contains('pslot')){
      const home = sec.phases.find(ph=>ph.slot===spec.target);
      zone.querySelector('.pv').innerHTML = spec.t + (correct ? '' :
        `<span class="corr">belongs to phase ${home?home.n:'?'}</span>`);
    } else {
      const home = sec.steps.find(st=>st.slot===spec.target);
      zone.innerHTML = spec.t + (correct ? '' :
        `<span class="corr">goes in step ${home?home.n:'?'}</span>`);
    }
    card.remove();
    const fb=document.getElementById('fb-bill');
    fb.innerHTML = (correct?'Correct. ':'Not quite. ') + '<strong>'+spec.t+'</strong> '+spec.fb;
    fb.classList.add('show');
    if(cardsDone(sec)){
      // fill any slot that never received its own card
      sec.cards.forEach(c=>{
        const z=document.querySelector(`[data-t="${c.target}"].slot2, [data-t="${c.target}"].pslot`);
        if(!z || z.classList.contains('ok') || z.classList.contains('no')) return;
        const into = z.classList.contains('pslot') ? z.querySelector('.pv') : z;
        if(into && !into.textContent.trim()) into.textContent = c.t;
      });
      fb.innerHTML = 'All ten steps filled in. Remember the shape of it: most bills never make it out of step 5.';
    }
  } else if(sec.type==='faces'){
    const nameOf = id => (sec.faces.find(f=>f.id===id)||{}).name;
    const chip=document.createElement('span');
    chip.className='chip2 '+(correct?'ok':'no');
    chip.textContent=spec.t;
    document.getElementById('drops-'+t).appendChild(chip);
    zone.classList.add('used');
    if(correct) zone.classList.add('ok');
    card.remove();
    const fb=document.getElementById('fb-faces');
    const line=document.createElement('div');
    line.innerHTML = correct
      ? `<strong>${spec.t}</strong> ${spec.fb}`
      : `<strong>Not ${nameOf(t)}.</strong> "${spec.t}" belongs to ${targets.map(nameOf).join(' or ')}. ${spec.fb}`;
    fb.appendChild(line); fb.classList.add('show');
  } else {
    card.classList.add('placed', correct?'ok':'no');
    const where = sec.type==='boxes'
      ? (sec.boxes.find(b=>b.id===spec.target)||{}).label
      : 'Area ' + (sec.spots.find(s=>s.id===spec.target)||{}).pin;
    card.innerHTML = spec.t +
      `<span class="verdict">${correct?'Correct':'Belongs in '+where}</span>` +
      `<span class="why">${spec.fb}</span>`;
    document.getElementById('list-'+t).appendChild(card);
    if(sec.type==='hotspots'){
      const filled = sec.cards.filter((c,ci)=>answered[gid+'-c'+ci] && c.target).length;
      zone.classList.add('full');
      if(cardsDone(sec)) sec.spots.forEach(s=>{
        document.getElementById('pin-'+s.id).textContent = s.pin + ': ' + s.reveal;
        document.getElementById('ah-'+s.id).textContent = 'Area ' + s.pin + ' - ' + s.reveal;
      });
    }
  }

  selected=null;
  zonesFor(gid).forEach(z=>z.classList.remove('hot'));
  updateCounter(sec); refreshDots();
}

document.addEventListener('pointerdown', e=>{
  const card = e.target.closest('.card');
  if(!card || card.disabled) return;
  e.preventDefault();                      // stop the browser starting a text-selection drag
  drag=card; moved=false; startX=e.clientX; startY=e.clientY;
  try{ card.setPointerCapture(e.pointerId); }catch(_){}
  card.classList.add('dragging');
});

document.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dx=e.clientX-startX, dy=e.clientY-startY;
  if(Math.abs(dx)>5||Math.abs(dy)>5) moved=true;
  drag.style.transform=`translate(${dx}px,${dy}px)`;
  const g=drag.dataset.g;
  const near = moved ? nearestZone(e.clientX,e.clientY,g) : null;
  zonesFor(g).forEach(z=>z.classList.toggle('hot', z===near));
});

function release(e){
  if(!drag) return;
  const card=drag; drag=null;
  card.classList.remove('dragging');
  card.style.transform='';
  const g=card.dataset.g;
  suppressClick=true; setTimeout(()=>suppressClick=false,0);
  if(moved){
    const zone=nearestZone(e.clientX,e.clientY,g);
    zonesFor(g).forEach(z=>z.classList.remove('hot'));
    if(zone) placeCard(card, zone);
  } else {
    setSelected(card);
  }
}
/* a cancelled or lost pointer is a clean release, never a silently dropped card */
document.addEventListener('pointerup', release);
document.addEventListener('pointercancel', release);
document.addEventListener('lostpointercapture', e=>{ if(drag) release(e); });

document.addEventListener('click', e=>{
  if(suppressClick) return;
  const zone = e.target.closest('.dropzone');
  if(zone && selected && selected.dataset.g===zone.dataset.g){ placeCard(selected, zone); return; }
  const card = e.target.closest('.card');          /* keyboard Enter or Space */
  if(card && !card.disabled) setSelected(card);
});

/* =========================================================
   FINISH
   ========================================================= */
function renderFinish(){
  document.getElementById('finalScore').textContent = score+' / '+TOTAL;
  const pct=score/TOTAL;
  document.getElementById('verdict').textContent =
    pct>=.9 ? 'You know this unit. Reread anything you missed and you are ready.' :
    pct>=.7 ? 'Solid. Look at the sections where you dropped points and run those again.' :
    pct>=.5 ? 'You have the big ideas. The details are where the points went. Run it again.' :
              'Go back through the slides for this unit, then come run this again.';
  document.getElementById('breakdown').innerHTML =
    SECTIONS.map(s=>`<div class="chip">${s.title}: ${sectionScore[s.id]} / ${s.pts}</div>`).join('');
}

goTo(0);
</script>
</body>
</html>
