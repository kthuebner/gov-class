<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checks and Balances: Interactive Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F7F4EE;
    --paper:#FFFFFF;
    --sand:#F2E3C8;
    --line:#DED6C9;
    --ink:#2B2723;
    --muted:#6E655D;
    --brick:#9E413C;
    --brick-dark:#7C3230;
    --green:#6C8B5F;
    --green-dark:#506946;
    --clay:#A6423C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:'Lora',Georgia,serif;
    -webkit-text-size-adjust:100%;
    touch-action:manipulation;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:14px 14px 28px;}

  /* ---------- toolbar ---------- */
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 2px 10px;}
  .bar h1{
    font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
    letter-spacing:.06em;font-size:1.05rem;margin:0;color:var(--ink);white-space:nowrap;
  }
  .dashes{display:flex;gap:4px;align-items:center;}
  .dashes i{display:block;width:12px;height:3px;background:var(--brick);opacity:.85;}
  .dashes i:nth-child(2){opacity:.7}.dashes i:nth-child(3){opacity:.55}
  .dashes i:nth-child(4){opacity:.4}.dashes i:nth-child(5){opacity:.25}
  .spacer{flex:1 1 auto;}
  .count{
    font-family:'Oswald',sans-serif;font-size:.82rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;
  }
  .count b{color:var(--ink);font-weight:600;}
  button{font-family:'Oswald',sans-serif;}
  .btn{
    appearance:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
    padding:7px 13px;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;
    border-radius:3px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;
  }
  .btn:hover{border-color:var(--brick);color:var(--brick);}
  .btn:focus-visible{outline:2.5px solid var(--brick);outline-offset:2px;}
  .tabs{display:flex;gap:0;border:1.5px solid var(--line);border-radius:3px;overflow:hidden;background:var(--paper);}
  .tab{
    appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
    padding:7px 12px;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;
    border-right:1.5px solid var(--line);transition:background .15s,color .15s;
  }
  .tab:last-child{border-right:0;}
  .tab:hover{color:var(--brick);}
  .tab[aria-selected="true"]{background:var(--brick);color:#fff;}
  .tab:focus-visible{outline:2.5px solid var(--ink);outline-offset:-3px;}

    container-type:inline-size;user-select:none;-webkit-user-select:none;
  }
  .slot{
    position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2px;border:2px dashed transparent;background:transparent;
    font-family:'Oswald',sans-serif;line-height:1.12;cursor:pointer;
    transition:background .16s,border-color .16s,box-shadow .16s;
    -webkit-tap-highlight-color:transparent;
  }
  .slot[hidden]{display:none;}
  .slot:focus-visible{outline:3px solid var(--brick);outline-offset:2px;}
  .slot.hot{border-color:var(--ink);background:rgba(255,255,255,.55);box-shadow:0 0 0 calc(0.35cqw) rgba(43,39,35,.12);}
  .slot.armed{border-color:rgba(43,39,35,.45);}
  .slot.wrong{animation:shake .4s;}
  @keyframes shake{
    0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}
    40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}
  }
  .slot.pop{animation:pop .32s ease-out;}
  @keyframes pop{0%{transform:scale(.82);opacity:.4}60%{transform:scale(1.06)}100%{transform:scale(1)}}

  /* level 2: pill slots that fill with a label */
  .slot.pill{border-radius:calc(0.9cqw + 4px);}
  .slot.filled{background:var(--green);border:2px solid var(--green-dark);color:#fff;cursor:default;box-shadow:0 1px 5px rgba(0,0,0,.28);}
  .slot.revealed{background:var(--muted);border-color:#4b443e;color:#fff;}
  .slot .lab{font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(6px,1.28cqw,17px);display:block;}
  .slot .sub{font-family:'Lora',serif;font-weight:400;font-size:clamp(5px,0.95cqw,12px);display:block;margin-top:.28em;opacity:.92;}

  /* level 1: blurred label patches that dissolve to reveal the printed label */
  .slot.frost{border-radius:2px;}
  .frostpatch{
    position:absolute;inset:-1px;background-size:100% 100%;background-repeat:no-repeat;
    pointer-events:none;transition:opacity .45s ease;
  }
  .slot.frost.hot .frostpatch{filter:brightness(1.1) contrast(.95);}
  .slot.done .frostpatch{opacity:0;}
  .slot.done{cursor:default;}
  .slot.ringok{animation:ringok 1.6s ease forwards;}
  .slot.ringrev{animation:ringrev 1.2s ease forwards;}
  @keyframes ringok{
    0%{border-color:var(--green-dark);box-shadow:0 0 0 3px rgba(108,139,95,.6)}
    60%{border-color:var(--green-dark);box-shadow:0 0 0 3px rgba(108,139,95,.35)}
    100%{border-color:transparent;box-shadow:none}
  }
  @keyframes ringrev{
    0%{border-color:var(--muted);box-shadow:0 0 0 3px rgba(110,101,93,.45)}
    100%{border-color:transparent;box-shadow:none}
  }

  /* ---------- status ---------- */
  .status{min-height:2.1em;margin:10px 2px 4px;font-size:.94rem;line-height:1.45;color:var(--muted);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .status strong{color:var(--ink);font-weight:600;}
  .status.good strong{color:var(--green-dark);}
  .status.bad strong{color:var(--clay);}
  .nextbtn{
    appearance:none;border:1.5px solid var(--green-dark);background:var(--green);color:#fff;
    padding:6px 13px;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;border-radius:3px;cursor:pointer;
  }
  .nextbtn:hover{background:var(--green-dark);}
  .nextbtn:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;}

  /* ---------- tray ---------- */
  .tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;}
  .card{
    position:relative;background:var(--paper);border:1.5px solid var(--line);border-left:5px solid var(--sand);
    border-radius:4px;padding:9px 11px 10px;cursor:grab;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-user-drag:none;
    transition:border-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;
  }
  .card:hover{border-color:#c9bfae;border-left-color:var(--brick);box-shadow:0 2px 7px rgba(43,39,35,.09);}
  .card:focus-visible{outline:3px solid var(--brick);outline-offset:2px;}
  .card.picked{border-color:var(--brick);border-left-color:var(--brick);background:#FDF7F1;box-shadow:0 0 0 2px rgba(158,65,60,.22);}
  .card.dragging{opacity:.32;}
  .card.gone{display:none;}
  .card .t{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    font-size:.79rem;color:var(--brick-dark);margin-bottom:3px;}
  .card .d{font-size:.87rem;line-height:1.35;}
  .ghost{position:fixed;z-index:999;pointer-events:none;width:250px;transform:translate(-50%,-50%) rotate(-1.2deg);
    box-shadow:0 10px 24px rgba(43,39,35,.3);opacity:.97;}

  /* ---------- recap ---------- */
  .recap{margin-top:14px;border:1.5px solid var(--line);border-top:4px solid var(--green);border-radius:4px;
    background:var(--paper);padding:14px 16px 16px;}
  .recap[hidden]{display:none;}
  .recap h2{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:.92rem;margin:0 0 9px;}
  .recap ul{margin:0;padding-left:1.1em;}
  .recap li{font-size:.9rem;line-height:1.5;margin-bottom:5px;}
  .recap li span{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:.76rem;letter-spacing:.05em;color:var(--brick-dark);}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  @media (max-width:640px){
    .wrap{padding:10px 10px 22px;}
    .bar h1{font-size:.9rem;}
    .tray{grid-template-columns:1fr 1fr;gap:7px;}
    .card{padding:7px 8px 8px;}
    .card .d{font-size:.78rem;}
    .card .t{font-size:.72rem;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>

</div>

  var stage   = document.getElementById("stage"),
      tray    = document.getElementById("tray"),
      status  = document.getElementById("status"),

      title   = document.getElementById("title"),

  var level = 1, cfg = null, data = null;
  var slots = {}, cards = {}, placed = 0, misses = 0, picked = null;

  function byKey(k){ return function(d){ return d.key === k; }; }
  function item(k){ return data.filter(byKey(k))[0]; }

  /* ---------- build ---------- */
  function buildSlots(){
    stage.querySelectorAll(".slot").forEach(function(n){ n.remove(); });
    slots = {};
    data.forEach(function(d){
      var s = document.createElement("button");
      s.type = "button";
      s.className = "slot " + (cfg.mode === "frost" ? "frost" : "pill");
      s.dataset.key = d.key;
      s.dataset.group = d.group;
      s.style.left = d.box.l + "%";
      s.style.top = d.box.t + "%";
      s.style.width = d.box.w + "%";
      s.style.height = d.box.h + "%";
      s.setAttribute("aria-label", (cfg.mode === "frost" ? "Blurred label, " : "Arrow " + d.key + ", ") + "empty");
      if (cfg.mode === "frost"){
        var fp = document.createElement("span");
        fp.className = "frostpatch";
        fp.style.backgroundImage = "url(" + PATCH[d.key] + ")";
        s.appendChild(fp);
      }
      stage.appendChild(s);
      slots[d.key] = s;
      s.addEventListener("click", function(){
        if (this.dataset.done) return;
        if (picked) tryPlace(picked, this);
        else say("Choose a card below first, then tap a target on the diagram.", "");
      });
    });
  }

  function buildTray(){
    var order = data.slice();
    for (var i = order.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = order[i]; order[i] = order[j]; order[j] = t;
    }
    tray.innerHTML = "";
    cards = {};
    order.forEach(function(d){
      var c = document.createElement("div");
      c.className = "card";
      c.tabIndex = 0;
      c.dataset.key = d.key;
      c.setAttribute("role","button");
      c.setAttribute("aria-label", d.title + ". " + d.text + " Press Enter to pick up, then choose a target on the diagram.");
      c.innerHTML = '<div class="t"></div><div class="d"></div>';
      c.querySelector(".t").textContent = d.title;
      c.querySelector(".d").textContent = d.text;
      tray.appendChild(c);
      cards[d.key] = c;
      wireCard(c);
    });
  }

  /* ---------- pointer drag and tap to place ---------- */
  function wireCard(card){
    var ghost = null, sx = 0, sy = 0, moving = false, lastHot = null, id = null;

    card.addEventListener("pointerdown", function(e){
      if (e.button != null && e.button !== 0) return;
      e.preventDefault();
      card.focus();
      id = e.pointerId; sx = e.clientX; sy = e.clientY; moving = false;
      try { card.setPointerCapture(id); } catch(err){}
    });

    card.addEventListener("pointermove", function(e){
      if (id === null || e.pointerId !== id) return;
      if (!moving){
        if (Math.abs(e.clientX - sx) < 6 && Math.abs(e.clientY - sy) < 6) return;
        moving = true;
        pick(card, true);
        ghost = card.cloneNode(true);
        ghost.className = "card ghost";
        ghost.setAttribute("aria-hidden","true");
        ghost.removeAttribute("data-key");
        ghost.removeAttribute("tabindex");
        document.body.appendChild(ghost);
        card.classList.add("dragging");
      }
      ghost.style.left = e.clientX + "px";
      ghost.style.top = e.clientY + "px";
      var over = hitSlot(e.clientX, e.clientY);
      if (over !== lastHot){ setHot(over); lastHot = over; }
    });

    card.addEventListener("pointerup", function(e){
      if (id === null) return;
      var pid = id; id = null;
      try { card.releasePointerCapture(pid); } catch(err){}
      card.classList.remove("dragging");
      if (ghost){ ghost.remove(); ghost = null; }
      setHot(null);
      if (!moving){ pick(card, !card.classList.contains("picked")); return; }
      var target = hitSlot(e.clientX, e.clientY);
      lastHot = null;
      if (target) tryPlace(item(card.dataset.key), target);
      else { clearPick(); say(cfg.hint, ""); }
    });

    /* A cancelled pointer used to leave the card mid-drag with no feedback,
       which read as a correct answer bouncing back. Treat it as a clean release. */
    function abort(){
      if (id === null) return;
      id = null;
      card.classList.remove("dragging");
      if (ghost){ ghost.remove(); ghost = null; }
      setHot(null); lastHot = null;
      if (moving){ clearPick(); say(cfg.hint, ""); }
    }
    card.addEventListener("pointercancel", abort);
    card.addEventListener("lostpointercapture", abort);
    card.addEventListener("dragstart", function(e){ e.preventDefault(); });

    card.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " "){
        e.preventDefault();
        pick(card, !card.classList.contains("picked"));
      }
    });
  }

  /* Forgiving hit test: nearest open target, with a tolerance ring around it,
     so a drop that lands near or just past a target still counts. */
  function distToRect(x, y, r){
    var dx = Math.max(r.left - x, 0, x - r.right);
    var dy = Math.max(r.top - y, 0, y - r.bottom);
    return Math.sqrt(dx * dx + dy * dy);
  }

  function hitSlot(x, y){
    var best = null, bestD = Infinity;
    for (var k in slots){
      var s = slots[k];
      if (s.dataset.done) continue;
      var d = distToRect(x, y, s.getBoundingClientRect());
      if (d < bestD){ bestD = d; best = s; }
    }
    var sr = stage.getBoundingClientRect();
    var tol = Math.max(30, sr.width * 0.055);
    return bestD <= tol ? best : null;
  }

  /* Highlight the whole group a target belongs to, so a branch bar lights up
     as one drop zone rather than two thin strips. */
  function setHot(slot){
    for (var k in slots) slots[k].classList.remove("hot");
    if (!slot) return;
    for (var j in slots){
      if (!slots[j].dataset.done && slots[j].dataset.group === slot.dataset.group)
        slots[j].classList.add("hot");
    }
  }

  function pick(card, on){
    clearPick();
    if (!on) return;
    picked = item(card.dataset.key);
    card.classList.add("picked");
    for (var k in slots) if (!slots[k].dataset.done) slots[k].classList.add("armed");
    say("Holding <strong>" + picked.title + "</strong>. Now choose a target on the diagram.", "");
  }

  function clearPick(){
    picked = null;
    for (var k in cards) cards[k].classList.remove("picked");
    for (var s in slots) slots[s].classList.remove("armed");
  }

  /* ---------- placement ---------- */
  function tryPlace(d, slot){
    if (!d) return;
    if (slot.dataset.group === d.group){
      fill(slots[d.key], d, false);
      cards[d.key].classList.add("gone");
      placed++;
      clearPick();
      update();
      if (placed === data.length) finishLevel();
      else say("<strong>" + d.title + "</strong> is right. " + (level === 1 ? d.text : d.dir + "."), "good");
    } else {
      misses++;
      slot.classList.remove("wrong");
      void slot.offsetWidth;
      slot.classList.add("wrong");
      clearPick();
      if (level === 1)
        say("Not there. <strong>" + d.title + "</strong> belongs somewhere else on the chart.", "bad");
      else
        say("Not " + slot.dataset.key + ". <strong>" + d.title + "</strong> runs a different direction. Check which branch the arrow leaves and which one it points to.", "bad");
    }
  }

  function fill(slot, d, revealed){
    slot.dataset.done = "1";
    slot.setAttribute("aria-label", d.title + ". " + d.text);
    if (cfg.mode === "frost"){
      slot.classList.remove("armed","hot");
      slot.classList.add("done", revealed ? "ringrev" : "ringok");
      slot.tabIndex = -1;
    } else {
      slot.classList.add(revealed ? "revealed" : "filled", "pop");
      slot.innerHTML = "";
      var lab = document.createElement("span");
      lab.className = "lab";
      lab.textContent = d.label;
      slot.appendChild(lab);
      if (d.sub){
        var sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = d.sub;
        slot.appendChild(sub);
      }
      slot.title = d.text;
    }
  }

  function finishLevel(){
    showRecap();
    var msg = level === 1
      ? "All six placed. " + (misses === 0 ? "<strong>No misses.</strong> " : "Finished with <strong>" + misses + " miss" + (misses === 1 ? "" : "es") + "</strong>. ") + "Now look at the seven arrows connecting them."
      : "All seven placed. " + (misses === 0 ? "<strong>No misses.</strong> Every arrow on the chart is one branch limiting another." : "Finished with <strong>" + misses + " miss" + (misses === 1 ? "" : "es") + "</strong>. Review the list below.");
    say(msg, "good");
    if (level === 1){
      var b = document.createElement("button");
      b.className = "nextbtn";
      b.type = "button";
      b.textContent = "Go to Level 2";
      b.addEventListener("click", function(){ setLevel(2); });
      status.appendChild(b);
    }
  }

  function update(){ count.innerHTML = "<b>" + placed + "</b> of " + data.length + " placed"; }

  function say(html, tone){
    status.className = "status" + (tone ? " " + tone : "");
    status.innerHTML = html;
  }

  function showRecap(){
    recapH.textContent = cfg.recapTitle;
    recapUL.innerHTML = "";
    data.forEach(function(d){
      var li = document.createElement("li");
      var s = document.createElement("span");
      s.textContent = (level === 2 ? d.key + ". " : "") + d.title + " ";
      li.appendChild(s);
      li.appendChild(document.createTextNode(level === 1 ? d.recap : d.text + " (" + d.dir + ".)"));
      recapUL.appendChild(li);
    });
    recap.hidden = false;
  }

  /* ---------- controls ---------- */
  document.getElementById("revealBtn").addEventListener("click", function(){
    clearPick();
    data.forEach(function(d){
      var s = slots[d.key];
      if (!s.dataset.done){
        fill(s, d, true);
        if (cards[d.key]) cards[d.key].classList.add("gone");
      }
    });
    placed = data.length;
    update();
    showRecap();
    say(level === 1
      ? "Answers shown. The printed labels are back on the chart."
      : "Answers shown. Gray boxes are the ones you had not placed yet.", "");
  });

  document.getElementById("resetBtn").addEventListener("click", function(){ setLevel(level, true); });
  tab1.addEventListener("click", function(){ setLevel(1); });
  tab2.addEventListener("click", function(){ setLevel(2); });

  function setLevel(n, keepMsg){
    level = n;
    cfg = LEVELS[n];
    data = cfg.data;
    placed = 0; misses = 0; picked = null;
    recap.hidden = true;
    title.textContent = cfg.title;
    tab1.setAttribute("aria-selected", n === 1 ? "true" : "false");
    tab2.setAttribute("aria-selected", n === 2 ? "true" : "false");
    buildSlots();
    buildTray();
    update();
    say(cfg.hint, "");
  }

  document.addEventListener("keydown", function(e){ if (e.key === "Escape") clearPick(); });

  setLevel(1);
})();
</script>
</body>
</html>
