<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presidents Study Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: header + party strip from the Timeline of Presidents, then a flip card with its answer bar beneath. Parchment only, by design. */
:root{
  color-scheme:light;
  --paper:#F4ECDD; --paper-2:#EADFCA; --paper-3:#E2D5BC; --card:#FFFBF3;
  --ink:#2A251F; --ink-2:#4A4238; --muted:#766B5C; --rule:#D2C3A7;
  --amber:#B47A2E; --amber-d:#8C5C1C;
  --ok:#4F7A3A; --bad:#A8443C;
  --pN:#A39C8F; --pF:#E9AD6D; --pDR:#8FBC7C; --pW:#F0CD5C; --pD:#5C8CB4; --pR:#DD6868;
  --serif:"Lora", Georgia, "Times New Roman", serif;
  --cond:"Oswald", "Arial Narrow", Impact, sans-serif;
  --card-h:clamp(400px, 60vh, 540px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--serif); color:var(--ink); background-color:var(--paper);
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
    repeating-linear-gradient(135deg, rgba(120,100,70,.035) 0 1px, transparent 1px 9px);
  display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden;
}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
img{user-select:none;-webkit-user-drag:none;max-width:100%}
.gut{padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px))}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding-block:12px 6px}
.kicker{font-family:var(--cond);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--cond);font-weight:600;font-size:clamp(26px,3vw,38px);line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:3px 0 6px;text-wrap:balance}
.dashes{display:flex;gap:6px}
.dashes i{display:block;width:22px;height:4px;border-radius:2px;background:var(--amber)}
.dashes i:nth-child(2){background:var(--pD)} .dashes i:nth-child(3){background:var(--ink-2)}
.dashes i:nth-child(4){background:var(--pR)} .dashes i:nth-child(5){background:var(--pDR)}

.modes{display:flex;background:var(--paper-2);border-radius:24px;padding:4px;gap:4px;align-self:center}
.mode{border:none;background:transparent;cursor:pointer;padding:8px 16px;border-radius:20px;font-family:var(--cond);font-size:14px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.mode:hover{background:var(--paper-3)}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mode:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.score{text-align:right;min-width:150px}
.score .lbl{display:block;font-family:var(--cond);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.score .val{font-family:var(--cond);font-weight:500;font-size:clamp(22px,2.6vw,32px);line-height:1.1;font-variant-numeric:tabular-nums}
.score .sub{display:block;font-family:var(--cond);font-size:12.5px;color:var(--muted);letter-spacing:.04em;min-height:1.2em}

/* ---------- toolbar ---------- */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:6px 4px}
.tg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tg .k{font-family:var(--cond);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{font-family:var(--cond);font-size:13px;letter-spacing:.04em;padding:4px 11px;border-radius:14px;border:1.5px solid var(--rule);background:transparent;cursor:pointer;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sw{display:inline-flex;align-items:center;gap:7px;font-family:var(--cond);font-size:13px;letter-spacing:.04em;color:var(--ink-2);cursor:pointer;user-select:none}
.sw input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.restart{margin-left:auto}

/* ---------- strip ---------- */
.strip-wrap{padding-block:6px 2px}
.strip{position:relative;display:flex;gap:2px;height:22px}
.cell{flex:1;border:none;padding:0;border-radius:2px;position:relative;background:var(--paper-3);cursor:pointer;min-width:0}
.cell:hover{filter:brightness(.95)}
.cell.ans{background:var(--pc)}
.cell.ans:hover{filter:brightness(1.08)}
.cell.miss::after{content:"";position:absolute;inset:0;border-radius:2px;background:repeating-linear-gradient(135deg,rgba(42,37,31,.55) 0 2px,transparent 2px 5px)}
.cell.cur{box-shadow:0 0 0 3px var(--ink), 0 0 0 5px var(--paper);z-index:1}
.cell:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.ticks{position:relative;height:16px;margin-top:5px}
.ticks span{position:absolute;transform:translateX(-50%);font-family:var(--cond);font-size:12px;color:var(--muted);letter-spacing:.05em;white-space:nowrap}
.ticks span.l{transform:none} @media (max-width:600px){.ticks span.m{display:none}}
.ticks span.l{transform:none} .ticks span.r{transform:translateX(-100%)}

/* ---------- stage ---------- */
.stage{flex:1 0 auto;display:flex;justify-content:center;align-items:flex-start;gap:36px;padding-block:14px 18px}
.col{display:flex;flex-direction:column;gap:14px;width:min(420px,100%);min-width:0}

/* previous-president panel */
.prev{width:210px;flex:none;margin-top:28px;display:flex;flex-direction:column;gap:6px}
.prev .k{font-family:var(--cond);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.prev .box{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 0 0 1.5px var(--rule)}
.prev .pic{height:190px;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden}
.prev .pic::before{content:"";position:absolute;inset:0;background:var(--pc);opacity:.85}
.prev .pic img{position:relative;max-height:94%;max-width:92%;object-fit:contain;object-position:bottom}
.prev .cap{padding:8px 12px 10px}
.prev .nm{font-family:var(--cond);font-size:20px;font-weight:500;line-height:1.1}
.prev .yr{font-family:var(--cond);font-size:14px;letter-spacing:.05em;color:var(--ink-2)}
.prev .start{padding:18px 16px;font-size:15px;line-height:1.5;color:var(--ink-2)}
.prev .arrow{display:flex;justify-content:center;color:var(--muted);margin-top:2px}

/* flip card */
.flip{position:relative;height:var(--card-h);perspective:1600px}
.flip-in{position:absolute;inset:0;transition:transform .6s cubic-bezier(.22,.8,.24,1);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden;
  background:var(--card);box-shadow:0 0 0 1.5px var(--ink), 0 10px 28px rgba(60,40,10,.16);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.face.back{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 18px 8px;border-bottom:1.5px solid var(--rule)}
.hd .ord{font-family:var(--cond);font-size:26px;font-weight:500;line-height:1}
.hd .ord small{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400;margin-right:6px}
.hd .tag{font-family:var(--cond);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.face .pic{position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;min-height:0}
.face .pic.party::before{content:"";position:absolute;inset:0;background:var(--pc);opacity:.85}
.face .pic.plain{background:radial-gradient(ellipse at 50% 85%, var(--paper-2), var(--card) 70%)}
.face .pic img{position:relative;max-height:96%;max-width:88%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 4px 6px rgba(60,40,10,.18))}
.face .pic svg.bust{width:62%;height:auto;max-height:92%;display:block}
.face .cap{padding:12px 18px 14px;border-top:1.5px solid var(--rule)}
.q{font-family:var(--cond);font-size:21px;font-weight:400;line-height:1.2;text-wrap:balance}
.q b{font-weight:500}
.nmline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.05}
.nmline .fn{font-family:var(--cond);font-size:18px}
.nmline .ln{font-family:var(--cond);font-size:34px;font-weight:500;text-transform:uppercase;letter-spacing:.01em}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.yrs{font-family:var(--cond);font-size:16px;letter-spacing:.05em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pchip{display:inline-flex;align-items:center;gap:7px;font-family:var(--cond);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 10px 2px 8px;border-radius:12px;background:var(--paper-2)}
.pchip b{width:11px;height:11px;border-radius:3px;display:inline-block}
.stamp{position:absolute;top:14px;right:14px;z-index:2;font-family:var(--cond);font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:4px 11px;border-radius:14px;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.stamp.ok{background:var(--ok)} .stamp.bad{background:var(--bad)} .stamp.part{background:var(--amber-d)} .stamp.rev{background:var(--ink-2)}

/* answer bar */
.ctl{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:3px;flex:1 1 140px;min-width:0}
.fld.yr{flex:0 1 112px}
.fld label{font-family:var(--cond);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fld input{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--ink);background:var(--card);font-family:var(--cond);font-size:20px;letter-spacing:.02em}
.fld input:focus{outline:3px solid var(--amber);outline-offset:1px}
.fld input.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.fld input.shake{animation:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--cond);font-size:15px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  padding:10px 18px;border-radius:22px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--paper-2)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{background:var(--amber-d);border-color:var(--amber-d)}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn svg{width:15px;height:15px}
.btn.grow{flex:1}
.msg{font-size:15px;line-height:1.45;min-height:1.45em;color:var(--ink-2)}
.msg b{font-weight:600;color:var(--ink)}
.msg.warn{color:var(--bad)}
.marks{display:flex;gap:6px;flex-wrap:wrap}
.mark{display:inline-flex;align-items:center;gap:6px;font-family:var(--cond);font-size:13.5px;letter-spacing:.06em;padding:4px 11px 4px 8px;border-radius:14px;color:#fff}
.mark.ok{background:var(--ok)} .mark.bad{background:var(--bad)}
.mark svg{width:13px;height:13px}
.mark s{opacity:.8}

/* round complete */
.done{width:min(760px,100%);background:var(--card);border-radius:14px;box-shadow:0 0 0 1.5px var(--ink), 0 10px 28px rgba(60,40,10,.16);padding:26px 28px}
.done h2{font-family:var(--cond);font-weight:500;font-size:32px;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px}
.done .big{font-family:var(--cond);font-size:20px;color:var(--ink-2);margin-bottom:16px}
.done .k{font-family:var(--cond);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}
.missed{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.mm{display:grid;grid-template-columns:44px 1fr;gap:0 10px;align-items:center;background:var(--paper);border-radius:8px;padding:6px 10px 6px 6px;min-width:0}
.mm .pp{width:44px;height:52px;border-radius:6px;overflow:hidden;position:relative;display:flex;align-items:flex-end;justify-content:center;grid-row:span 2}
.mm .pp::before{content:"";position:absolute;inset:0;background:var(--pc);opacity:.85}
.mm .pp img{position:relative;max-height:100%}
.mm .n{font-family:var(--cond);font-size:15px;font-weight:500;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm .y{font-family:var(--cond);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.done .row{gap:10px}
.perfect{font-size:16px;line-height:1.55;margin:0 0 18px}

.foot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:4px 20px;flex-wrap:wrap;padding-block:6px 10px;font-size:12.5px;color:var(--muted)}
.foot kbd{font-family:var(--cond);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--paper)}
.foot a{font-family:var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-decoration-color:var(--amber);text-underline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:820px){
  .stage{flex-direction:column;align-items:center;gap:12px}
  .prev{width:min(420px,100%);margin-top:0;flex-direction:row;align-items:center}
  .prev .k{display:none}
  .prev .box{display:grid;grid-template-columns:70px 1fr;width:100%}
  .prev .pic{height:80px}
  .prev .cap{display:flex;flex-direction:column;justify-content:center;padding:6px 12px}
  .prev .cap::before{content:"Previous";font-family:var(--cond);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .prev .start{grid-column:1/-1;padding:10px 14px}
  .prev .arrow{display:none}
  .score{min-width:0}
}
@media (max-width:600px){
  .gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .top{align-items:flex-start}
  .modes{order:3;width:100%} .mode{flex:1;padding:8px 6px;font-size:13px}
  .restart{margin-left:0}
  :root{--card-h:clamp(360px, 56vh, 460px)}
  .nmline .ln{font-size:28px}
}
</style>
</head>
<body>
<header class="top gut">
  <div>
    <div class="kicker">Mr. Huebner's American Government</div>
    <h1>Presidents Study Game</h1>
    <div class="dashes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="modes" role="group" aria-label="Game mode">
    <button class="mode" id="m1" aria-pressed="true">Who Came Next?</button>
    <button class="mode" id="m2" aria-pressed="false">Name the Portrait</button>
  </div>
  <div class="score" aria-live="polite"><span class="lbl" id="scLbl">Correct</span><span class="val" id="scVal">0 of 0</span><span class="sub" id="scSub"></span></div>
</header>

<div class="tools gut">
  <div class="tg" role="group" aria-label="Which presidents"><span class="k">Presidents</span><span id="ranges"></span></div>
  <div class="tg" id="orderGrp" role="group" aria-label="Card order" hidden><span class="k">Order</span>
    <button class="chip" id="oShuf" aria-pressed="true">Shuffled</button><button class="chip" id="oChron" aria-pressed="false">In order</button></div>
  <label class="sw"><input type="checkbox" id="strict"> Exact spelling</label>
  <button class="chip restart" id="restart">Start over</button>
</div>

<section class="strip-wrap gut" aria-label="Progress through the deck">
  <div class="strip" id="strip"></div>
  <div class="ticks" id="ticks"></div>
</section>

<main class="stage gut" id="stage">
  <aside class="prev" id="prev"></aside>
  <div class="col" id="col">
    <div class="flip" id="flip">
      <div class="flip-in">
        <div class="face front" id="front"></div>
        <div class="face back" id="back" aria-hidden="true"></div>
      </div>
    </div>
    <form class="ctl" id="ctl" autocomplete="off" novalidate></form>
  </div>
  <section class="done" id="done" hidden aria-live="polite"></section>
</main>

<footer class="foot gut">
  <span id="help"></span>
  <a href="unit-5.html">Timeline of Presidents</a>
</footer>

<script>
/* ===================== DATA =====================
   Pulled from the Timeline of Presidents (unit-5.html) and its pres-timeline/ portraits.
   [number, id, first, last, party, took office, left office (null = in office), portrait] */
const IMG_DIR = "pres-timeline/";
const T = [
[1,"washington","George","Washington","N",1789,1797,"washington"],
[2,"j-adams","John","Adams","F",1797,1801,"j-adams"],
[3,"jefferson","Thomas","Jefferson","DR",1801,1809,"jefferson"],
[4,"madison","James","Madison","DR",1809,1817,"madison"],
[5,"monroe","James","Monroe","DR",1817,1825,"monroe"],
[6,"jq-adams","John Quincy","Adams","DR",1825,1829,"jq-adams"],
[7,"jackson","Andrew","Jackson","D",1829,1837,"jackson"],
[8,"van-buren","Martin","Van Buren","D",1837,1841,"van-buren"],
[9,"wh-harrison","William Henry","Harrison","W",1841,1841,"wh-harrison"],
[10,"tyler","John","Tyler","W",1841,1845,"tyler"],
[11,"polk","James K.","Polk","D",1845,1849,"polk"],
[12,"taylor","Zachary","Taylor","W",1849,1850,"taylor"],
[13,"fillmore","Millard","Fillmore","W",1850,1853,"fillmore"],
[14,"pierce","Franklin","Pierce","D",1853,1857,"pierce"],
[15,"buchanan","James","Buchanan","D",1857,1861,"buchanan"],
[16,"lincoln","Abraham","Lincoln","R",1861,1865,"lincoln"],
[17,"a-johnson","Andrew","Johnson","R",1865,1869,"a-johnson"],
[18,"grant","Ulysses S.","Grant","R",1869,1877,"grant"],
[19,"hayes","Rutherford B.","Hayes","R",1877,1881,"hayes"],
[20,"garfield","James A.","Garfield","R",1881,1881,"garfield"],
[21,"arthur","Chester A.","Arthur","R",1881,1885,"arthur"],
[22,"cleveland","Grover","Cleveland","D",1885,1889,"cleveland"],
[23,"b-harrison","Benjamin","Harrison","R",1889,1893,"b-harrison"],
[24,"cleveland","Grover","Cleveland","D",1893,1897,"cleveland"],
[25,"mckinley","William","McKinley","R",1897,1901,"mckinley"],
[26,"t-roosevelt","Theodore","Roosevelt","R",1901,1909,"t-roosevelt"],
[27,"taft","William H.","Taft","R",1909,1913,"taft"],
[28,"wilson","Woodrow","Wilson","D",1913,1921,"wilson"],
[29,"harding","Warren G.","Harding","R",1921,1923,"harding"],
[30,"coolidge","Calvin","Coolidge","R",1923,1929,"coolidge"],
[31,"hoover","Herbert","Hoover","R",1929,1933,"hoover"],
[32,"fdr","Franklin D.","Roosevelt","D",1933,1945,"fdr"],
[33,"truman","Harry","Truman","D",1945,1953,"truman"],
[34,"eisenhower","Dwight D.","Eisenhower","R",1953,1961,"eisenhower"],
[35,"kennedy","John F.","Kennedy","D",1961,1963,"kennedy"],
[36,"lbj","Lyndon B.","Johnson","D",1963,1969,"lbj"],
[37,"nixon","Richard","Nixon","R",1969,1974,"nixon"],
[38,"ford","Gerald","Ford","R",1974,1977,"ford"],
[39,"carter","Jimmy","Carter","D",1977,1981,"carter"],
[40,"reagan","Ronald","Reagan","R",1981,1989,"reagan"],
[41,"ghw-bush","George H.W.","Bush","R",1989,1993,"ghw-bush"],
[42,"clinton","Bill","Clinton","D",1993,2001,"clinton"],
[43,"gw-bush","George W.","Bush","R",2001,2009,"gw-bush"],
[44,"obama","Barack","Obama","D",2009,2017,"obama"],
[45,"trump","Donald J.","Trump","R",2017,2021,"trump"],
[46,"biden","Joseph","Biden","D",2021,2025,"biden"],
[47,"trump","Donald J.","Trump","R",2025,null,"trump-2025"]
].map(r => ({n:r[0], id:r[1], first:r[2], last:r[3], party:r[4], a:r[5], b:r[6], img:r[7]}));

const PARTY = {
  N:{name:"No party", hex:"#A39C8F"}, F:{name:"Federalist", hex:"#E9AD6D"},
  DR:{name:"Democratic-Republican", hex:"#8FBC7C"}, W:{name:"Whig", hex:"#F0CD5C"},
  D:{name:"Democratic", hex:"#5C8CB4"}, R:{name:"Republican", hex:"#DD6868"}
};

/* One entry per person for the portrait game (Cleveland and Trump keep both terms). */
const PEOPLE = [];
T.forEach(t => {
  let p = PEOPLE.find(x => x.id === t.id);
  if (!p) { p = {id:t.id, first:t.first, last:t.last, party:t.party, img:t.img, terms:[]}; PEOPLE.push(p); }
  p.terms.push(t);
  p.img = t.img;           // latest portrait (Trump shows his 2025 portrait)
});

const RANGES = [
  {k:"all", label:"All", lo:1, hi:47},
  {k:"a", label:"1 to 16", lo:1, hi:16},
  {k:"b", label:"16 to 32", lo:16, hi:32},
  {k:"c", label:"32 to 47", lo:32, hi:47}
];

/* Nicknames that count as the name. */
const ALIAS = {fdr:["fdr"], kennedy:["jfk"], lbj:["lbj"]};

/* Presidents who share a last name. Returns 1 if the answer points to this one,
   -1 if it points to the other one, 0 if it doesn't say. */
const any = (tok, ...w) => w.some(x => tok.includes(x));
const DIS = {
  "j-adams":    (t,j) => j.includes("quincy") || any(t,"jq","q") ? -1 : any(t,"john") ? 1 : 0,
  "jq-adams":   (t,j) => j.includes("quincy") || any(t,"jq","q") ? 1 : any(t,"john") ? -1 : 0,
  "wh-harrison":(t)   => any(t,"william","henry","wh","w","tippecanoe") ? 1 : any(t,"benjamin","ben","b") ? -1 : 0,
  "b-harrison": (t)   => any(t,"benjamin","ben","b") ? 1 : any(t,"william","henry","wh","w","tippecanoe") ? -1 : 0,
  "a-johnson":  (t)   => any(t,"andrew","andy","a") ? 1 : any(t,"lyndon","lbj","lb","l") ? -1 : 0,
  "lbj":        (t)   => any(t,"lyndon","lbj","lb","l") ? 1 : any(t,"andrew","andy","a") ? -1 : 0,
  "t-roosevelt":(t)   => any(t,"theodore","teddy","ted","tr","t") ? 1 : any(t,"franklin","fdr","delano","fd","f") ? -1 : 0,
  "fdr":        (t)   => any(t,"franklin","fdr","delano","fd","f") ? 1 : any(t,"theodore","teddy","ted","tr","t") ? -1 : 0,
  "ghw-bush":   (t)   => ghw(t) ? 1 : gw(t) ? -1 : 0,
  "gw-bush":    (t)   => ghw(t) ? -1 : gw(t) ? 1 : 0
};
function ghw(t){ return any(t,"h","hw","ghw","herbert","sr","senior","41"); }
function gw(t){ return any(t,"w","gw","dubya","jr","junior","43"); }
const SHARED = {"j-adams":"Adams","jq-adams":"Adams","wh-harrison":"Harrison","b-harrison":"Harrison","a-johnson":"Johnson","lbj":"Johnson","t-roosevelt":"Roosevelt","fdr":"Roosevelt","ghw-bush":"Bush","gw-bush":"Bush"};

/* ===================== HELPERS ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ordinal = n => { const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
const fullName = p => p.first + " " + p.last;
const span = t => t.a + "-" + (t.b == null ? "present" : t.b);
const termsText = p => p.terms.map(span).join(" and ");
const numsText = p => p.terms.map(t => ordinal(t.n)).join(" and ");
const imgSrc = name => IMG_DIR + name + ".webp";
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[.'’]/g,"").replace(/[^a-z0-9]+/g," ").trim();
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
/* Grade a typed name. needFirst = the answer must say which Adams, Bush, etc.
   Returns {r:"ok"|"close"|"ambig"|"wrong"} */
function gradeName(p, input, needFirst){
  const s = norm(input); if (!s) return {r:"empty"};
  const tok = s.split(" "), joined = tok.join("");
  const key = norm(p.last).replace(/ /g,"");
  const dis = DIS[p.id] ? DIS[p.id](tok, joined) : null;
  if ((ALIAS[p.id]||[]).some(a => tok.includes(a))) return {r:"ok"};
  let r = "wrong";
  if (tok.includes(key) || joined.endsWith(key)) r = "ok";
  else if (!strict) {
    const tol = key.length >= 8 ? 2 : key.length >= 5 ? 1 : 0;
    const cands = [tok[tok.length-1], tok.slice(-2).join(""), joined];
    if (tol && cands.some(c => lev(c,key) <= tol)) r = "close";
  }
  if (r === "wrong") return {r};
  if (dis === -1) return {r:"wrong"};
  if (needFirst && dis === 0) return {r:"ambig"};
  return {r};
}
function gradeYear(input, ok){
  const s = String(input).trim().toLowerCase();
  if (!s) return false;
  if (ok.includes(null) && /^(present|now|current|today|still|in office|2029)/.test(s)) return true;
  const y = parseInt(s.replace(/[^0-9]/g,""), 10);
  return ok.includes(y);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>',
  down:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg>',
  right:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>'
};
const BUST = '<svg class="bust" viewBox="0 0 200 220" aria-hidden="true"><path d="M100 22c-27 0-46 21-46 50 0 21 9 38 21 47l-3 15c-34 8-56 30-60 86h176c-4-56-26-78-60-86l-3-15c12-9 21-26 21-47 0-29-19-50-46-50z" fill="var(--paper-3)"/><text x="100" y="98" text-anchor="middle" font-family="Oswald, Arial Narrow, sans-serif" font-size="64" font-weight="500" fill="var(--card)">?</text></svg>';

/* ===================== STATE ===================== */
let mode = store.get("psg-mode") === "2" ? 2 : 1;
let strict = store.get("psg-strict") === "1";
let rangeK = store.get("psg-range") || "all";
let shuffled = store.get("psg-order") !== "chron";
let deck = [], pos = 0, res = {}, phase = "ask", hinted = false, retryOnly = null;

function rangeObj(){ return RANGES.find(r => r.k === rangeK) || RANGES[0]; }
function buildDeck(){
  const R = rangeObj();
  if (mode === 1) {
    deck = T.filter(t => t.n >= R.lo && t.n <= R.hi);
  } else {
    deck = PEOPLE.filter(p => p.terms.some(t => t.n >= R.lo && t.n <= R.hi));
    if (shuffled) shuffle(deck);
  }
  if (retryOnly) deck = deck.filter(d => retryOnly.has(key(d)));
  pos = 0; res = {}; phase = "ask"; hinted = false;
}
const key = d => mode === 1 ? "n" + d.n : d.id;
const personOf = t => PEOPLE.find(p => p.id === t.id);

/* ===================== RENDER ===================== */
function renderTools(){
  $("m1").setAttribute("aria-pressed", mode === 1); $("m2").setAttribute("aria-pressed", mode === 2);
  $("ranges").innerHTML = RANGES.map(r => `<button class="chip" data-r="${r.k}" aria-pressed="${r.k===rangeK}">${r.label}</button>`).join(" ");
  $("orderGrp").hidden = mode !== 2;
  $("oShuf").setAttribute("aria-pressed", shuffled); $("oChron").setAttribute("aria-pressed", !shuffled);
  $("strict").checked = strict;
  $("help").innerHTML = mode === 1
    ? 'Type the last name of the president who came next. <kbd>Enter</kbd> checks, <kbd>Enter</kbd> again flips to the next card.'
    : 'Type the name and the years in office. Last name is enough unless two presidents share it. <kbd>Enter</kbd> checks, <kbd>Enter</kbd> again moves on.';
}

function renderScore(){
  const vals = Object.values(res);
  if (mode === 1) {
    const right = vals.filter(v => v.ok).length;
    $("scLbl").textContent = "Correct";
    $("scVal").textContent = right + " of " + vals.length;
    const h = vals.filter(v => v.hint).length;
    $("scSub").textContent = (deck.length - vals.length) + " to go" + (h ? ", " + h + " with hints" : "");
  } else {
    const pts = vals.reduce((s,v) => s + v.pts, 0);
    $("scLbl").textContent = "Points";
    $("scVal").textContent = pts + " of " + vals.length * 3;
    $("scSub").textContent = (deck.length - vals.length) + " to go";
  }
}

function renderStrip(){
  const strip = $("strip"); strip.innerHTML = "";
  deck.forEach((d,i) => {
    const b = document.createElement("button");
    const r = res[key(d)];
    b.className = "cell" + (r ? " ans" : "") + (r && !r.full ? " miss" : "") + (i === pos ? " cur" : "");
    if (r) b.style.setProperty("--pc", PARTY[d.party].hex);
    const lab = r ? (mode===1 ? `${ordinal(d.n)} president, ${fullName(d)}` : fullName(d)) : `Card ${i+1}`;
    b.setAttribute("aria-label", lab + (r ? (r.full ? ", correct" : ", missed") : ", not answered") + ". Go to this card.");
    b.addEventListener("click", () => go(i));
    strip.appendChild(b);
  });
  const ticks = $("ticks"); ticks.innerHTML = "";
  const n = deck.length; if (!n) return;
  const at = (i, txt) => {
    const s = document.createElement("span"); s.textContent = txt;
    const x = (i + .5) / n * 100;
    if (i === 0) { s.className = "l"; s.style.left = "0"; }
    else if (i === n-1) { s.className = "r"; s.style.left = "100%"; }
    else { s.className = "m"; s.style.left = x + "%"; }
    ticks.appendChild(s);
  };
  if (mode === 1) {
    // first and last start years, plus the first presidency of each half century
    at(0, deck[0].a); at(n-1, deck[n-1].a);
    deck.forEach((d,i) => {
      if (i < 3 || i > n-4) return;
      if (Math.floor(d.a/50) !== Math.floor(deck[i-1].a/50)) at(i, d.a);
    });
  } else {
    at(0, "Card 1"); at(n-1, "Card " + n);
  }
}

function picHTML(name, cls, color, alt){
  return `<div class="pic ${cls}" ${color ? `style="--pc:${color}"` : ""}><img src="${imgSrc(name)}" alt="${esc(alt)}" loading="eager"></div>`;
}

function renderPrev(){
  const box = $("prev");
  if (mode !== 1) { box.hidden = true; return; }
  box.hidden = false;
  const t = deck[pos]; if (!t) return;
  const prior = T.find(x => x.n === t.n - 1);
  if (!prior) {
    box.innerHTML = `<span class="k">Start here</span><div class="box"><div class="start">The first president under the Constitution took office in 1789. Who was it?</div></div>`;
    return;
  }
  box.innerHTML = `<span class="k">Previous</span>
    <div class="box">${picHTML(prior.img, "", PARTY[prior.party].hex, fullName(prior))}
      <div class="cap"><div class="nm">${esc(fullName(prior))}</div><div class="yr">${ordinal(prior.n)} &middot; ${span(prior)}</div></div></div>
    <div class="arrow">${ICON.right}</div>`;
}

function backHTML(p, terms, r){
  const t0 = terms[0];
  const stamp = !r ? "" : r.revealed ? `<span class="stamp rev">Revealed</span>`
    : r.full ? `<span class="stamp ok">Correct</span>`
    : r.pts > 0 ? `<span class="stamp part">${r.pts} of 3</span>`
    : `<span class="stamp bad">Missed</span>`;
  const ordTxt = mode === 1 ? `<span class="ord"><small>President</small>No. ${t0.n}</span>` : `<span class="ord"><small>President</small>No. ${p.terms.map(t=>t.n).join(" &amp; ")}</span>`;
  const yrs = mode === 1 ? span(t0) : termsText(p);
  const tag = mode === 1 && p.terms.length > 1 ? `<span class="tag">${t0.n === p.terms[0].n ? "First" : "Second"} of two terms</span>` : (p.terms.length > 1 ? `<span class="tag">Two separate terms</span>` : "");
  return `<div class="hd">${ordTxt}${tag}</div>
    <div style="position:relative;display:grid;min-height:0">${stamp}${picHTML(mode===1 ? t0.img : p.img, "party", PARTY[p.party].hex, fullName(p))}</div>
    <div class="cap"><div class="nmline"><span class="fn">${esc(p.first)}</span><span class="ln">${esc(p.last)}</span></div>
      <div class="meta"><span class="yrs">${yrs}</span><span class="pchip"><b style="background:${PARTY[p.party].hex}"></b>${PARTY[p.party].name}</span></div></div>`;
}

function renderCard(){
  const d = deck[pos];
  $("done").hidden = true; $("col").hidden = false;
  const flip = $("flip");
  const r = res[key(d)];
  // place the card face-up or face-down without animating when jumping
  flip.querySelector(".flip-in").style.transition = "none";
  flip.classList.toggle("flipped", !!r);
  void flip.offsetWidth;
  flip.querySelector(".flip-in").style.transition = "";
  phase = r ? "shown" : "ask";
  if (mode === 1) {
    const prior = T.find(x => x.n === d.n - 1);
    $("front").innerHTML = `<div class="hd"><span class="ord"><small>President</small>No. ${d.n}</span><span class="tag">${pos+1} of ${deck.length}</span></div>
      <div class="pic plain">${BUST}</div>
      <div class="cap"><div class="q">${prior ? `Who came after <b>${esc(fullName(prior))}</b>?` : `Who was the <b>first</b> president?`}</div></div>`;
    $("back").innerHTML = backHTML(personOf(d), [d], r);
  } else {
    $("front").innerHTML = `<div class="hd"><span class="ord"><small>Card</small>${pos+1} of ${deck.length}</span><span class="tag">Who is this?</span></div>
      ${picHTML(d.img, "plain", null, "Portrait of a president")}
      <div class="cap"><div class="q">Name this president and give the <b>years in office</b>.</div></div>`;
    $("back").innerHTML = backHTML(d, d.terms, r);
  }
  $("front").setAttribute("aria-hidden", !!r); $("back").setAttribute("aria-hidden", !r);
  renderCtl();
  renderPrev(); renderStrip(); renderScore();
  preload();
}

function renderCtl(){
  const d = deck[pos], r = res[key(d)], ctl = $("ctl");
  if (!r) {
    hinted = false;
    if (mode === 1) {
      ctl.innerHTML = `<div class="row"><div class="fld"><label for="ans">Last name</label><input id="ans" type="text" spellcheck="false" autocapitalize="words"></div></div>
        <div class="row"><button class="btn pri grow" type="submit">${ICON.check}Check</button><button class="btn" type="button" id="hintBtn">Hint</button><button class="btn" type="button" id="revBtn">Reveal</button></div>
        <div class="msg" id="msg" role="status"></div>`;
      $("hintBtn").onclick = () => {
        hinted = true;
        $("msg").innerHTML = `Hint: in office <b>${span(d)}</b>, first name starts with <b>${esc(d.first[0])}</b>.`;
        $("hintBtn").disabled = true; $("ans").focus();
      };
    } else {
      ctl.innerHTML = `<div class="row"><div class="fld"><label for="ans">Name</label><input id="ans" type="text" spellcheck="false" autocapitalize="words"></div></div>
        <div class="row"><div class="fld yr"><label for="y1">Took office</label><input id="y1" type="text" inputmode="numeric" maxlength="7" placeholder="Year"></div>
          <div class="fld yr"><label for="y2">Left office</label><input id="y2" type="text" inputmode="numeric" maxlength="7" placeholder="Year"></div>
          <button class="btn pri grow" type="submit" style="align-self:flex-end">${ICON.check}Check</button></div>
        <div class="row"><button class="btn" type="button" id="revBtn">Reveal</button></div>
        <div class="msg" id="msg" role="status"></div>`;
    }
    $("revBtn").onclick = () => record({revealed:true});
    setTimeout(() => $("ans") && $("ans").focus({preventScroll:true}), 30);
  } else {
    const last = pos === deck.length - 1;
    let fb = "";
    if (mode === 1) {
      const p = personOf(d);
      fb = r.revealed ? `The answer is <b>${esc(fullName(p))}</b>.`
        : r.ok ? (r.close ? `Counted as correct. It is spelled <b>${esc(p.last)}</b>.` : (r.hint ? "Correct, with a hint." : "Correct."))
        : `Not quite. You typed <b>${esc(r.typed)}</b>.`;
    } else {
      const m = (ok, label, val) => `<span class="mark ${ok?"ok":"bad"}">${ok?ICON.check:ICON.x}${label}${!ok && val ? ` <s>${esc(val)}</s>` : ""}</span>`;
      fb = r.revealed ? `The answer is <b>${esc(fullName(d))}</b>, ${termsText(d)}.`
        : `<div class="marks">${m(r.name,"Name",r.typed)}${m(r.y1,"Took office",r.t1)}${m(r.y2,"Left office",r.t2)}</div>`
          + (r.close ? `<div style="margin-top:6px">Name counted. It is spelled <b>${esc(d.last)}</b>.</div>` : "")
          + (d.terms.length > 1 && !r.revealed ? `<div style="margin-top:6px">${esc(d.last)} served two separate terms, so either one counts.</div>` : "");
    }
    ctl.innerHTML = `<div class="msg" id="msg" role="status">${fb}</div>
      <div class="row"><button class="btn pri grow" type="submit" id="nextBtn">${last ? "Finish round" : "Next card"}${ICON.next}</button></div>`;
    setTimeout(() => $("nextBtn") && $("nextBtn").focus({preventScroll:true}), 30);
  }
}

function nudge(text, field){
  $("msg").innerHTML = text; $("msg").classList.add("warn");
  const f = $(field || "ans"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); f.focus();
}

function check(){
  const d = deck[pos];
  if (mode === 1) {
    const v = $("ans").value, p = personOf(d);
    if (!v.trim()) return nudge("Type a last name, or press Reveal.");
    const g = gradeName(p, v, false);
    record({ok: g.r === "ok" || g.r === "close", close: g.r === "close", typed: v.trim(), hint: hinted});
  } else {
    const v = $("ans").value, a = $("y1").value, b = $("y2").value;
    if (!v.trim()) return nudge("Type a name, or press Reveal.");
    if (!a.trim() || !b.trim()) return nudge("Fill in both years. Your best guess is fine.", !a.trim() ? "y1" : "y2");
    const g = gradeName(d, v, true);
    if (g.r === "ambig") return nudge(`Two presidents were named <b>${SHARED[d.id]}</b>. Add a first name or initials.`);
    const name = g.r === "ok" || g.r === "close";
    const y1 = gradeYear(a, d.terms.map(t => t.a));
    // left-office year must match the term the start year came from, when the start year is right
    const startTerm = d.terms.find(t => gradeYear(a, [t.a]));
    const y2 = gradeYear(b, startTerm ? [startTerm.b] : d.terms.map(t => t.b));
    record({name, y1, y2, close: g.r === "close", typed: v.trim(), t1: a.trim(), t2: b.trim()});
  }
}

function record(r){
  const d = deck[pos];
  if (mode === 1) { r.full = !!r.ok && !r.revealed; }
  else { r.pts = r.revealed ? 0 : (r.name?1:0)+(r.y1?1:0)+(r.y2?1:0); r.full = r.pts === 3; }
  res[key(d)] = r;
  phase = "shown";
  $("back").innerHTML = mode === 1 ? backHTML(personOf(d), [d], r) : backHTML(d, d.terms, r);
  $("flip").classList.add("flipped");
  $("front").setAttribute("aria-hidden", true); $("back").setAttribute("aria-hidden", false);
  renderCtl(); renderStrip(); renderScore();
}

function go(i){ pos = Math.max(0, Math.min(deck.length-1, i)); renderCard(); }
function next(){
  const open = deck.findIndex((d,i) => i > pos && !res[key(d)]);
  if (open >= 0) return go(open);
  const any = deck.findIndex(d => !res[key(d)]);
  if (any >= 0) return go(any);
  finish();
}

function finish(){
  $("col").hidden = true; $("prev").hidden = true;
  const missed = deck.filter(d => !res[key(d)].full);
  const vals = Object.values(res);
  const score = mode === 1 ? `${vals.filter(v=>v.ok).length} of ${deck.length} correct`
    : `${vals.reduce((s,v)=>s+v.pts,0)} of ${deck.length*3} points`;
  const card = d => {
    const p = mode === 1 ? personOf(d) : d;
    return `<div class="mm"><div class="pp" style="--pc:${PARTY[p.party].hex}"><img src="${imgSrc(mode===1?d.img:p.img)}" alt=""></div>
      <span class="n">${esc(fullName(p))}</span><span class="y">${mode===1 ? "No. " + d.n + ", " + span(d) : termsText(p)}</span></div>`;
  };
  $("done").innerHTML = `<h2>Round complete</h2><div class="big">${score}</div>
    ${missed.length ? `<div class="k">Study these (${missed.length})</div><div class="missed">${missed.map(card).join("")}</div>`
      : `<p class="perfect">A clean sweep. Try a different range, or switch modes.</p>`}
    <div class="row">${missed.length ? `<button class="btn pri" id="retryBtn">Retry the ${missed.length} I missed</button>` : ""}
      <button class="btn" id="againBtn">Start over</button></div>`;
  $("done").hidden = false;
  if (missed.length) $("retryBtn").onclick = () => { retryOnly = new Set(missed.map(key)); buildDeck(); renderCard(); };
  $("againBtn").onclick = restart;
  renderStrip(); renderScore();
  ($("retryBtn") || $("againBtn")).focus({preventScroll:true});
}

function preload(){
  [deck[pos+1], deck[pos+2]].forEach(d => { if (d) new Image().src = imgSrc(d.img); });
  if (mode === 1 && deck[pos]) new Image().src = imgSrc(deck[pos].img);
}

function restart(){ retryOnly = null; buildDeck(); renderTools(); renderCard(); }

/* ===================== EVENTS ===================== */
$("ctl").addEventListener("submit", e => { e.preventDefault(); phase === "ask" ? check() : next(); });
$("m1").onclick = () => { if (mode !== 1) { mode = 1; store.set("psg-mode","1"); restart(); } };
$("m2").onclick = () => { if (mode !== 2) { mode = 2; store.set("psg-mode","2"); restart(); } };
$("ranges").addEventListener("click", e => { const b = e.target.closest("[data-r]"); if (!b) return; rangeK = b.dataset.r; store.set("psg-range", rangeK); restart(); });
$("oShuf").onclick = () => { shuffled = true; store.set("psg-order","shuf"); restart(); };
$("oChron").onclick = () => { shuffled = false; store.set("psg-order","chron"); restart(); };
$("strict").onchange = e => { strict = e.target.checked; store.set("psg-strict", strict ? "1" : "0"); };
$("restart").onclick = restart;
$("flip").addEventListener("click", e => { if (phase === "shown" && !e.target.closest("button")) $("nextBtn") && $("nextBtn").focus(); });

restart();
</script>
</body>
</html>
