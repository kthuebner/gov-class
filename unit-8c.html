<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How a Bill Becomes a Law | Interactive Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --parchment:#f5efe2;
  --paper:#fffdf8;
  --ink:#2b2721;
  --ink-soft:#5c5347;
  --rule:#d8ceba;
  --p1:#c98a3c;
  --p2:#6f9a72;
  --p3:#7c6a9e;
  --p4:#b4615c;
  --danger:#8f3b34;
  --shadow:0 2px 10px rgba(43,39,33,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--parchment);
  color:var(--ink);
  font-family:'Lora',Georgia,serif;
  line-height:1.55;
  -webkit-text-size-adjust:100%;
}

/* ---------- Controls ---------- */
.controls{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:14px 24px;background:var(--paper);
  border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:40;
}
.controls-inner{max-width:1500px;margin:0 auto;width:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font-family:'Oswald',sans-serif;cursor:pointer}
.btn{
  background:var(--paper);border:1px solid var(--rule);color:var(--ink);
  padding:7px 14px;border-radius:3px;font-size:.82rem;letter-spacing:.06em;
  text-transform:uppercase;transition:background .15s,border-color .15s;
}
.btn:hover{background:#f0e8d6;border-color:#bfb298}
.btn:disabled{opacity:.38;cursor:default}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:#453f36}
.spacer{flex:1 1 auto}
.hint{
  font-size:.78rem;color:var(--ink-soft);font-family:'Oswald',sans-serif;
  letter-spacing:.05em;text-transform:uppercase;
}

/* ---------- Viewer ---------- */
.viewer-wrap{max-width:1500px;margin:0 auto;padding:18px 24px 0}
.viewer{
  position:relative;overflow:auto;
  background:#eaeaea;border:1px solid var(--rule);border-radius:4px;
  box-shadow:var(--shadow);
  scroll-behavior:smooth;
  cursor:grab;
}
.viewer.dragging{cursor:grabbing;scroll-behavior:auto}
.stage{position:relative;overflow:hidden}
.stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

.hot{
  position:absolute;
  background:transparent;border:2px solid transparent;border-radius:6px;
  padding:0;margin:0;
  transition:border-color .14s ease, box-shadow .18s ease, background-color .14s ease;
}
.hot.round{border-radius:50%}
.hot:focus{outline:none}
.hot::after{
  content:attr(data-cue);
  position:absolute;left:50%;bottom:-9px;transform:translate(-50%,100%);
  font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);padding:3px 8px;border-radius:2px;
  white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;
}
.lit{
  border-color:var(--accent,#2b2721);
  background:rgba(255,253,248,.14);
  box-shadow:0 0 0 9999px rgba(38,34,28,.48);
  z-index:5;
}
/* In overview the whole flow should stay readable, so the current step
   keeps its outline but does not dim everything else. */
.viewer[data-mode="overview"] .lit{box-shadow:0 0 0 3px rgba(255,253,248,.85)}
@media (hover:hover){
  .hot:hover{
    border-color:var(--accent,#2b2721);
    background:rgba(255,253,248,.14);
    box-shadow:0 0 0 9999px rgba(38,34,28,.48);
    z-index:6;
  }
  .hot:hover::after{opacity:1}
}
.hot:focus-visible{
  border-color:var(--accent,#2b2721);
  box-shadow:0 0 0 4px rgba(255,253,248,.9), 0 0 0 9999px rgba(38,34,28,.48);
  z-index:7;
}
.img-fallback{
  display:none;padding:40px 24px;text-align:center;color:var(--danger);
  font-family:'Oswald',sans-serif;letter-spacing:.05em;
}
.viewer.no-image .img-fallback{display:block}
.viewer.no-image .stage{display:none}

/* ---------- Rail ---------- */
.rail-wrap{max-width:1500px;margin:0 auto;padding:14px 24px 34px}
.rail{
  display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding-bottom:6px;
}
.chip{
  flex:0 0 auto;background:var(--paper);border:1px solid var(--rule);
  border-bottom:3px solid var(--chip,#bfb298);
  border-radius:3px;padding:6px 11px;min-width:74px;text-align:left;
  transition:transform .12s,border-color .12s,background .12s;
}
.chip:hover{background:#f0e8d6;transform:translateY(-2px)}
.chip.current{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{
  display:block;font-family:'Oswald',sans-serif;font-size:.68rem;
  letter-spacing:.14em;text-transform:uppercase;opacity:.72;
}
.chip .t{
  display:block;font-family:'Oswald',sans-serif;font-size:.8rem;line-height:1.2;
  white-space:nowrap;
}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(30,27,22,.62);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .18s;z-index:100;
}
.overlay.open{opacity:1;pointer-events:auto}
.panel{
  background:var(--paper);width:min(760px,100%);max-height:88vh;
  display:flex;flex-direction:column;border-radius:5px;
  box-shadow:0 18px 50px rgba(30,27,22,.35);
  transform:translateY(10px);transition:transform .18s;
  border-top:6px solid var(--accent,#2b2721);
}
.overlay.open .panel{transform:translateY(0)}
.panel-head{padding:20px 26px 14px;border-bottom:1px solid var(--rule);position:relative}
.panel-eyebrow{
  font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent,#5c5347);margin:0 0 6px;
}
.panel-title{font-family:'Oswald',sans-serif;font-weight:500;font-size:1.5rem;margin:0;line-height:1.15}
.panel-q{margin:10px 0 0;font-style:italic;color:var(--ink-soft);font-size:.95rem}
.close{
  position:absolute;top:14px;right:14px;background:none;border:none;
  font-size:1.4rem;line-height:1;color:var(--ink-soft);padding:6px 9px;border-radius:3px;
}
.close:hover{background:#f0e8d6;color:var(--ink)}
.panel-body{padding:20px 26px 24px;overflow-y:auto}
.block{margin:0 0 18px}
.block:last-child{margin-bottom:0}
.block h3{
  font-family:'Oswald',sans-serif;font-size:.78rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 7px;
  padding-bottom:5px;border-bottom:1px solid var(--rule);
}
.block p{margin:0 0 9px}
.block ul{margin:0;padding-left:20px}
.block li{margin-bottom:7px}
.tag{
  font-family:'Oswald',sans-serif;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent,#5c5347);margin-right:6px;
}
.dies{
  background:#fbf1ef;border:1px solid #e6cbc6;border-left:4px solid var(--danger);
  padding:14px 16px;border-radius:3px;
}
.dies h3{color:var(--danger);border-bottom-color:#e6cbc6}
.dies li{color:#5b332e}
.panel-foot{
  display:flex;gap:8px;align-items:center;
  padding:13px 26px;border-top:1px solid var(--rule);background:#faf5ea;
}

@media (max-width:640px){
  .controls,.viewer-wrap,.rail-wrap{padding-left:14px;padding-right:14px}
  .panel-head,.panel-body,.panel-foot{padding-left:18px;padding-right:18px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>


<div class="controls">
  <div class="controls-inner">
    <button class="btn" id="prevBtn">Previous</button>
    <button class="btn primary" id="nextBtn">Next step</button>
    <button class="btn" id="zoomBtn">See the whole flow</button>
    <button class="btn" id="restartBtn">Back to the start</button>
    <span class="spacer"></span>
    <span class="hint">Drag the diagram to pan. Arrow keys work too.</span>
  </div>
</div>

<div class="viewer-wrap">
  <div class="viewer" id="viewer" tabindex="0" aria-label="Interactive diagram of the legislative process">
    <div class="stage" id="stage">
      <img id="diagram" src="bill-to-law-diagram.png" alt="Flow chart showing how a bill becomes a law across four phases and ten steps">
    </div>
    <div class="img-fallback">The diagram image did not load. Make sure bill-to-law-diagram.png sits in the same folder as this page.</div>
  </div>
</div>

<div class="rail-wrap">
  <div class="rail" id="rail"></div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
  <div class="panel" id="panel">
    <div class="panel-head">
      <p class="panel-eyebrow" id="panelEyebrow"></p>
      <h2 class="panel-title" id="panelTitle"></h2>
      <p class="panel-q" id="panelQ"></p>
      <button class="close" id="closeBtn" aria-label="Close">&times;</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-foot">
      <button class="btn" id="mPrev">Previous</button>
      <button class="btn primary" id="mNext">Next step</button>
      <span class="spacer"></span>
      <button class="btn" id="mClose">Close</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Source image is 2500 x 807. All hotspots are given in
   source pixels and converted to percentages so they scale.
   ========================================================= */
const IMG_W = 2500, IMG_H = 807;

const PHASE = {
  p1:{name:'Phase 1: Introduction', color:'#c98a3c'},
  p2:{name:'Phase 2: Committee Work', color:'#6f9a72'},
  p3:{name:'Phase 3: Floor Action', color:'#7c6a9e'},
  p4:{name:'Phase 4: Presidential Action', color:'#b4615c'}
};

/* box = [x0, y0, x1, y1] in source pixels */
const NODES = [
  {
    id:'start', box:[18,340,128,484], phase:'p1', cue:'Start',
    rail:{n:'Start', t:'An Idea'},
    title:'Start: It is an Idea',
    body:[
      {p:'Every law in the country begins as an idea. At this point it is nothing more than that: a problem somebody wants fixed, a program somebody wants funded, a rule somebody wants changed.'},
      {p:'Anyone can have the idea. Only a member of Congress can turn it into a bill.'}
    ]
  },
  {
    id:'s1', box:[140,340,351,484], phase:'p1', cue:'Step 1',
    rail:{n:'Step 1', t:'Idea to Bill'},
    title:'Step 1: An Idea becomes a Bill',
    body:[
      {h:'Who', ul:['Any citizen, organization, or interest group can propose an idea, but only a member of Congress can introduce the bill- but the reality is that most bills come from interest groups, lobbyists or from politicians, like members of Congress or the President']},
      {h:'Forming a Bill', ul:['The idea is drafted into a bill (actually written) with the help of legislative staff and legal experts.']}
    ]
  },
  {
    id:'s2', box:[364,340,575,484], phase:'p1', cue:'Step 2',
    rail:{n:'Step 2', t:'Introduction'},
    title:'Step 2: Bill Introduction',
    q:'Does the bill get a sponsor?',
    body:[
      {h:'Who', ul:['A representative or senator introduces the bill.','Sponsor- the bill needs a member of the House or Senate to sponsor and introduce the bill']}
    ],
    dies:['No member of Congress agrees to sponsor or introduce the bill.']
  },
  {
    id:'s3', box:[587,340,798,484], phase:'p2', cue:'Step 3',
    rail:{n:'Step 3', t:'To Committee'},
    title:'Step 3: Referred to Committee',
    q:'Does the committee ignore the bill?',
    body:[
      {p:'The Speaker of the House or Senate Majority Leader refers the bill to the appropriate committee, based on the bill\u2019s subject matter (e.g., education, defense). The Committee Chair yields a lot of power at this point.'}
    ]
  },
  {
    id:'s4', box:[811,340,1021,484], phase:'p2', cue:'Step 4',
    rail:{n:'Step 4', t:'Committee Review'},
    title:'Step 4: Committee Review',
    q:'Will the bill make it to a committee vote?',
    body:[
      {h:'Subcommittees', ul:['The bill is often sent to a subcommittee for more focused study, debate, hearings, and possible amendments.']},
      {h:'Hearings', ul:['Stakeholders (experts, lobbyists, public witnesses) testify for or against the bill.']},
      {h:'Mark-Up', ul:['The subcommittee will "mark-up" the bill- make changes and decide on the final wording of the bill.']}
    ],
    dies:['The committee ignores the bill and no hearings or vote are held - MOST BILLS DIE in the committee phase- there are ways to force a bill out of committee i.e. discharge petition in the House']
  },
  {
    id:'s5', box:[1034,340,1245,484], phase:'p2', cue:'Step 5',
    rail:{n:'Step 5', t:'Committee Vote'},
    title:'Step 5: Committee Vote',
    q:'Will they send it to the full House or Senate? Will the committee report on it favorably?',
    body:[
      {p:'The committee votes on whether to send the bill to the full House or Senate for debate and consideration.'}
    ],
    dies:['The bill fails to gain a majority vote in the committee- (there are technically ways around this such as a discharge petition in the House of Reps)']
  },
  {
    id:'s6', box:[1259,340,1470,484], phase:'p3', cue:'Step 6',
    rail:{n:'Step 6', t:'Scheduled'},
    title:'Step 6: Scheduled for Debate',
    q:'Will the Bill get on the calendar for debate?',
    body:[
      {h:'House', ul:['The House Rules Committee decides how and when the bill will be debated- [The Speaker has power here]']},
      {h:'Senate', ul:['The Majority Leader schedules the bill for debate.']}
    ],
    dies:['The bill is not scheduled for debate or gets delayed indefinitely.']
  },
  {
    id:'s7', box:[1482,340,1693,484], phase:'p3', cue:'Step 7',
    rail:{n:'Step 7', t:'Debate'},
    title:'Step 7: Debate and Amendments',
    q:'Will the Bill make it to a vote?',
    body:[
      {h:'House', ul:['Strict time limits are often placed on debate. Members can propose amendments.']},
      {h:'Senate', ul:['Debates are more open-ended, and senators can filibuster (prolong debate to delay a vote). A filibuster can be ended by a "cloture" vote requiring 60 senators.']}
    ],
    dies:[
      'The bill fails to receive enough support to pass / never gets voted on',
      'In the Senate, a filibuster prevents the bill from being voted on, and cloture is not achieved.',
      'The bill is amended in a way that kills support- poison pill'
    ]
  },
  {
    id:'s8', box:[1704,340,1915,484], phase:'p3', cue:'Step 8',
    rail:{n:'Step 8', t:'Floor Vote'},
    title:'Step 8: Floor Vote',
    q:'Will the bill pass?',
    body:[
      {h:'House', ul:['A simple majority is required to pass the bill.']},
      {h:'Senate', ul:['A simple majority is required, though 60 votes may be needed to overcome a filibuster']},
      {h:'Start Over', ul:['If the bill passes in one chamber it has to start the process from the beginning in the other chamber!']}
    ],
    dies:['The bill loses the vote in either chamber.']
  },
  {
    id:'s9', box:[1928,340,2139,484], phase:'p3', cue:'Step 9',
    rail:{n:'Step 9', t:'Reconciliation'},
    title:'Step 9: Reconciliation of House and Senate Versions',
    q:'Will both chambers approve the new version?',
    body:[
      {p:'If the House and Senate pass different versions of the bill, a conference committee made up of members from both chambers works out the differences. Then both chambers must approve the reconciled version.'}
    ],
    dies:['The two chambers cannot agree on the final version, or the reconciled bill is rejected by either chamber']
  },
  {
    id:'s10', box:[2151,340,2362,484], phase:'p4', cue:'Step 10',
    rail:{n:'Step 10', t:'President'},
    title:'Step 10: Presidential Decision',
    q:'Will the President sign the bill into law?',
    body:[
      {p:'The bill is sent to the president, he can sign it, veto it or do nothing\u2026'},
      {h:'Veto', ul:['The president can veto the bill, sending it back to Congress with objections, this can be overridden by a \u2154 majority vote']},
      {h:'No Action', ul:['If the president takes no action while Congress is in session, the bill becomes law automatically.']}
    ],
    dies:[
      'Veto - (with no override, the bill dies when it is vetoed)',
      'Pocket Veto: If Congress adjourns within the 10-day period and the president takes no action, the bill is vetoed automatically- these are pretty rare, I think the last one was during Clinton\u2019s presidency.'
    ]
  },
  {
    id:'finish', box:[2374,340,2483,484], phase:'p4', cue:'Finish',
    rail:{n:'Finish', t:'It is a Law'},
    title:'Finish Line: It is a Law',
    body:[
      {p:'The bill has cleared committee, cleared the floor of both chambers, survived reconciliation, and been signed by the president or passed over his veto.'},
      {p:'Out of roughly 10,000 bills introduced in a typical two year Congress, only a few hundred make it this far.'}
    ]
  }
];

/* Non-sequence hotspots: phase banners, death points, loop backs */
const EXTRAS = [
  {
    id:'p1band', box:[19,212,575,317], phase:'p1', cue:'Phase 1',
    title:'Phase 1: Introduction',
    body:[
      {p:'The idea becomes an actual written bill and finds a member of Congress willing to put their name on it.'},
      {h:'Steps in this phase', ul:['Step 1: An Idea becomes a Bill','Step 2: Bill Introduction']}
    ]
  },
  {
    id:'p2band', box:[587,212,1245,317], phase:'p2', cue:'Phase 2',
    title:'Phase 2: Committee Work',
    body:[
      {p:'The real work, and the real graveyard. Committees study, amend, and decide whether the full chamber ever sees the bill.'},
      {h:'Steps in this phase', ul:['Step 3: Referred to Committee','Step 4: Committee Review','Step 5: Committee Vote']}
    ]
  },
  {
    id:'p3band', box:[1258,212,2139,317], phase:'p3', cue:'Phase 3',
    title:'Phase 3: Floor Action',
    body:[
      {p:'The bill goes before the full chamber: scheduling, debate, amendments, and the vote. Then the whole process repeats in the other chamber, and the two versions have to be reconciled.'},
      {h:'Steps in this phase', ul:['Step 6: Scheduled for Debate','Step 7: Debate and Amendments','Step 8: Floor Vote','Step 9: Reconciliation of House and Senate Versions']}
    ]
  },
  {
    id:'p4band', box:[2151,212,2478,317], phase:'p4', cue:'Phase 4',
    title:'Phase 4: Presidential Action',
    body:[
      {p:'One person, three options: sign it, veto it, or do nothing.'},
      {h:'Steps in this phase', ul:['Step 10: Presidential Decision']}
    ]
  },
  {
    id:'loop1', box:[1062,10,1218,166], phase:'p3', cue:'Start over', round:true,
    title:'Bill Passes One Chamber',
    body:[
      {p:'If the bill passes in one chamber it has to start the process from the beginning in the other chamber.'},
      {p:'Committee referral, committee review, committee vote, scheduling, debate, floor vote: all of it happens again with a different set of members and a different set of rules.'}
    ]
  },
  {
    id:'loop2', box:[1910,10,2066,166], phase:'p4', cue:'Override', round:true,
    title:'Presidential Veto and Override',
    body:[
      {p:'The president can veto the bill, sending it back to Congress with objections, this can be overridden by a \u2154 majority vote.'},
      {p:'That means two thirds of both chambers, not two thirds of one. It is the single hardest vote to assemble in Congress, which is why most vetoes stand.'}
    ]
  },
  {
    id:'d1', box:[355,640,500,795], phase:'p1', cue:'Dead end',
    title:'Bill Dies: No Sponsor',
    dies:['No member of Congress agrees to sponsor or introduce the bill.'],
    body:[{p:'An idea with no sponsor never becomes a bill at all. It does not get a number, it does not get referred anywhere, and it does not appear in any record of the session.'}]
  },
  {
    id:'d2', box:[820,615,965,795], phase:'p2', cue:'Dead end',
    title:'Bill Dies in Committee',
    dies:[
      'The committee ignores the bill and no hearings or vote are held - MOST BILLS DIE in the committee phase- there are ways to force a bill out of committee i.e. discharge petition in the House',
      'The bill fails to gain a majority vote in the committee- (there are technically ways around this such as a discharge petition in the House of Reps)'
    ],
    body:[{p:'This is the widest part of the funnel. A committee chair who simply never schedules a hearing has killed the bill without a single member going on record.'}]
  },
  {
    id:'d3', box:[1635,640,1780,795], phase:'p3', cue:'Dead end',
    title:'Bill Dies on the Floor',
    dies:[
      'The bill is not scheduled for debate or gets delayed indefinitely.',
      'The bill fails to receive enough support to pass / never gets voted on',
      'In the Senate, a filibuster prevents the bill from being voted on, and cloture is not achieved.',
      'The bill is amended in a way that kills support- poison pill',
      'The bill loses the vote in either chamber.',
      'The two chambers cannot agree on the final version, or the reconciled bill is rejected by either chamber'
    ],
    body:[{p:'A bill can die on the floor without ever losing a vote. Never being scheduled, never reaching cloture, and never surviving conference all end the same way.'}]
  },
  {
    id:'d4', box:[2015,645,2165,795], phase:'p4', cue:'Dead end',
    title:'Bill Dies: Veto or Pocket Veto',
    dies:[
      'Veto - (with no override, the bill dies when it is vetoed)',
      'Pocket Veto: If Congress adjourns within the 10-day period and the president takes no action, the bill is vetoed automatically- these are pretty rare, I think the last one was during Clinton\u2019s presidency.'
    ],
    body:[{p:'A regular veto can be answered. A pocket veto cannot: Congress has adjourned, so there is nothing to override.'}]
  }
];

const ALL = NODES.concat(EXTRAS);
const byId = Object.fromEntries(ALL.map(n=>[n.id,n]));

/* ---------- Build hotspots ---------- */
const stage = document.getElementById('stage');
const viewer = document.getElementById('viewer');

ALL.forEach(node=>{
  const [x0,y0,x1,y1] = node.box;
  const el = document.createElement('button');
  el.className = 'hot' + (node.round ? ' round' : '');
  el.type = 'button';
  el.dataset.id = node.id;
  el.dataset.cue = node.cue;
  el.setAttribute('aria-label', node.title);
  el.style.left   = (x0/IMG_W*100) + '%';
  el.style.top    = (y0/IMG_H*100) + '%';
  el.style.width  = ((x1-x0)/IMG_W*100) + '%';
  el.style.height = ((y1-y0)/IMG_H*100) + '%';
  el.style.setProperty('--accent', PHASE[node.phase].color);
  el.addEventListener('click', ()=>{ openNode(node.id); });
  stage.appendChild(el);
});

/* ---------- Rail ---------- */
const rail = document.getElementById('rail');
NODES.forEach((node,i)=>{
  const c = document.createElement('button');
  c.className='chip'; c.type='button'; c.dataset.id=node.id;
  c.style.setProperty('--chip', PHASE[node.phase].color);
  c.innerHTML = '<span class="n">'+node.rail.n+'</span><span class="t">'+node.rail.t+'</span>';
  c.addEventListener('click', ()=>{ current=i; focusNode(node.id); openNode(node.id); });
  rail.appendChild(c);
});

/* ---------- Zoom and panning ---------- */
let mode = 'focus';           // 'focus' or 'overview'
let dimOn = false;            // spotlight dimming turns on after the first move
let current = 0;              // index into NODES

function fitWidth(){ return viewer.clientWidth; }
function focusWidth(){
  const w = Math.max(fitWidth()*1.9, 1400);
  return Math.min(w, IMG_W);
}
function applyMode(scrollToCurrent){
  viewer.dataset.mode = mode;
  const w = (mode==='overview') ? fitWidth() : focusWidth();
  stage.style.width = w + 'px';
  const stageH = w * IMG_H / IMG_W;
  if(mode==='overview'){
    viewer.style.height = Math.ceil(stageH) + 'px';
  }else{
    const avail = Math.max(320, Math.min(window.innerHeight*0.62, 640));
    viewer.style.height = Math.ceil(Math.min(stageH, avail)) + 'px';
  }
  document.getElementById('zoomBtn').textContent =
    (mode==='overview') ? 'Zoom back in' : 'See the whole flow';
  if(scrollToCurrent) requestAnimationFrame(()=>focusNode(NODES[current].id, dimOn));
}

function focusNode(id, dim){
  const node = byId[id];
  if(!node) return;
  const w = parseFloat(stage.style.width);
  const scale = w / IMG_W;
  const [x0,y0,x1,y1] = node.box;
  const cx = (x0+x1)/2 * scale;
  const cy = (y0+y1)/2 * scale;
  const left = cx - viewer.clientWidth/2;
  const top  = cy - viewer.clientHeight*0.45;
  viewer.scrollTo({left:Math.max(0,left), top:Math.max(0,top), behavior:'smooth'});
  highlight(id, dim!==false);
}

function highlight(id, dim){
  const on = (dim===undefined) ? true : !!dim;
  stage.querySelectorAll('.hot').forEach(h=>h.classList.toggle('lit', on && h.dataset.id===id));
  rail.querySelectorAll('.chip').forEach(c=>c.classList.toggle('current', c.dataset.id===id));
  const chip = rail.querySelector('.chip[data-id="'+id+'"]');
  if(chip) chip.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
}

/* drag to pan */
let down=false, sx=0, sy=0, sl=0, st=0, moved=false;
viewer.addEventListener('pointerdown', e=>{
  if(e.target.closest('.hot')) return;
  down=true; moved=false; sx=e.clientX; sy=e.clientY;
  sl=viewer.scrollLeft; st=viewer.scrollTop;
  viewer.classList.add('dragging');
});
window.addEventListener('pointermove', e=>{
  if(!down) return;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
  viewer.scrollLeft = sl-dx; viewer.scrollTop = st-dy;
});
window.addEventListener('pointerup', ()=>{ down=false; viewer.classList.remove('dragging'); });

/* ---------- Modal ---------- */
const overlay=document.getElementById('overlay');
const panel=document.getElementById('panel');
let openId=null;

function renderBlocks(node){
  let html='';
  (node.body||[]).forEach(b=>{
    html += '<div class="block">';
    if(b.h) html += '<h3>'+b.h+'</h3>';
    if(b.p) html += '<p>'+b.p+'</p>';
    if(b.ul){ html += '<ul>'+b.ul.map(li=>'<li>'+li+'</li>').join('')+'</ul>'; }
    html += '</div>';
  });
  if(node.dies){
    html += '<div class="block dies"><h3>\u2620 Bill Dies Here If</h3><ul>'+
            node.dies.map(d=>'<li>'+d+'</li>').join('')+'</ul></div>';
  }
  return html;
}

function openNode(id){
  const node = byId[id];
  if(!node) return;
  dimOn = true;
  openId = id;
  const idx = NODES.findIndex(n=>n.id===id);
  if(idx>-1){ current = idx; }
  highlight(id);
  panel.style.setProperty('--accent', PHASE[node.phase].color);
  document.getElementById('panelEyebrow').textContent = PHASE[node.phase].name;
  document.getElementById('panelTitle').textContent = node.title;
  const q=document.getElementById('panelQ');
  q.textContent = node.q ? node.q : '';
  q.style.display = node.q ? 'block' : 'none';
  document.getElementById('panelBody').innerHTML = renderBlocks(node);
  document.getElementById('panelBody').scrollTop = 0;
  document.getElementById('mPrev').disabled = (idx<=0);
  document.getElementById('mNext').disabled = (idx===-1 || idx>=NODES.length-1);
  document.getElementById('mNext').textContent = (idx===-1) ? 'Next step' : 'Next step';
  overlay.classList.add('open');
  document.getElementById('closeBtn').focus();
}
function closeModal(){
  overlay.classList.remove('open');
  openId=null;
  viewer.focus({preventScroll:true});
}
document.getElementById('closeBtn').addEventListener('click', closeModal);
document.getElementById('mClose').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

/* ---------- Navigation ---------- */
function go(delta){
  dimOn = true;
  const next = Math.min(NODES.length-1, Math.max(0, current+delta));
  current = next;
  const id = NODES[current].id;
  focusNode(id);
  if(overlay.classList.contains('open')) openNode(id);
  syncNav();
}
function syncNav(){
  document.getElementById('prevBtn').disabled = (current<=0);
  document.getElementById('nextBtn').disabled = (current>=NODES.length-1);
}
document.getElementById('prevBtn').addEventListener('click', ()=>go(-1));
document.getElementById('nextBtn').addEventListener('click', ()=>go(1));
document.getElementById('mPrev').addEventListener('click', ()=>go(-1));
document.getElementById('mNext').addEventListener('click', ()=>go(1));
document.getElementById('restartBtn').addEventListener('click', ()=>{
  current=0; dimOn=false; closeModal(); focusNode('start', false); syncNav();
});
document.getElementById('zoomBtn').addEventListener('click', ()=>{
  mode = (mode==='overview') ? 'focus' : 'overview';
  applyMode(mode==='focus');
  if(mode==='overview'){ viewer.scrollTo({left:0, top:0, behavior:'smooth'}); }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && overlay.classList.contains('open')){ closeModal(); return; }
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'){ e.preventDefault(); go(1); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); go(-1); }
});

/* ---------- Init ---------- */
const img=document.getElementById('diagram');
img.addEventListener('error', ()=>viewer.classList.add('no-image'));
function init(){
  applyMode(false);
  focusNode('start', false);
  syncNav();
}
if(img.complete) init(); else img.addEventListener('load', init);

let rt;
window.addEventListener('resize', ()=>{
  clearTimeout(rt);
  rt=setTimeout(()=>applyMode(true), 180);
});
</script>
</body>
</html>
