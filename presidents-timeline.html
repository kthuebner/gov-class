<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline of Presidents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4ECDD; --paper-2:#EADFCA; --paper-3:#E2D5BC;
  --ink:#2A251F; --ink-2:#4A4238; --muted:#766B5C; --rule:#D2C3A7;
  --amber:#B47A2E; --amber-d:#8C5C1C;
  --pN:#A39C8F; --pF:#E9AD6D; --pDR:#8FBC7C; --pW:#F0CD5C; --pD:#5C8CB4; --pR:#DD6868;
  --pad:64px; --slot:360px;
  --mk-h:70px; --banner-h:48px; --info-h:84px;
  --serif:"Lora", Georgia, "Times New Roman", serif;
  --cond:"Oswald", "Arial Narrow", Impact, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--serif); color:var(--ink);
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
    repeating-linear-gradient(135deg, rgba(120,100,70,.035) 0 1px, transparent 1px 9px);
  display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden;
}
button{font:inherit;color:inherit}
img{user-select:none;-webkit-user-drag:none}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:12px 28px 8px}
.kicker{font-family:var(--cond);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--cond);font-weight:600;font-size:clamp(26px,3vw,38px);line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:3px 0 7px}
.dashes{display:flex;gap:6px}
.dashes i{display:block;width:22px;height:4px;border-radius:2px;background:var(--amber)}
.dashes i:nth-child(2){background:var(--pD)} .dashes i:nth-child(4){background:var(--pR)}
.dashes i:nth-child(3){background:var(--ink-2)} .dashes i:nth-child(5){background:var(--pDR)}
.range{text-align:right}
.range .lbl{display:block;font-family:var(--cond);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.range .val{font-family:var(--cond);font-weight:500;font-size:clamp(22px,2.6vw,34px);line-height:1.1}

/* ---------- party strip ---------- */
.strip-wrap{padding:4px 28px 6px}
.strip{position:relative;display:flex;gap:2px;height:26px;cursor:pointer;touch-action:none}
.cell{flex:1;border-radius:2px;position:relative}
.cell:hover{filter:brightness(1.08) saturate(1.1)}
.win{position:absolute;top:-5px;bottom:-5px;border:3px solid var(--ink);border-radius:5px;pointer-events:none;
  box-shadow:0 0 0 2px rgba(244,236,221,.9), 0 2px 8px rgba(0,0,0,.18);transition:left .55s cubic-bezier(.22,.8,.24,1), width .3s}
.ticks{position:relative;height:16px;margin-top:5px}
.ticks span{position:absolute;transform:translateX(-50%);font-family:var(--cond);font-size:12px;color:var(--muted);letter-spacing:.05em}
.legend{flex:1;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;align-self:flex-end;padding-bottom:6px;font-family:var(--cond);font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend b{display:inline-block;width:14px;height:14px;border-radius:3px}

/* ---------- stage ---------- */
.stage{flex:1;display:grid;grid-template-columns:88px minmax(0,1fr) 88px;grid-template-rows:minmax(330px,1fr) auto;min-height:0;padding:0 0 4px}
.nav{align-self:center;justify-self:center;width:68px;height:68px;border-radius:50%;border:none;cursor:pointer;
  background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.22);
  transition:transform .15s, background .15s, opacity .2s}
.nav:hover{background:var(--amber-d);transform:scale(1.06)}
.nav:active{transform:scale(.96)}
.nav:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.nav[disabled]{opacity:.22;cursor:default;transform:none;background:var(--ink)}
.nav svg{width:30px;height:30px}
.vp{position:relative;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 calc(var(--pad)*.8),#000 calc(100% - var(--pad)*.8),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 calc(var(--pad)*.8),#000 calc(100% - var(--pad)*.8),transparent 100%)}
.stage-vp{touch-action:pan-y}
.track{position:absolute;top:0;left:0;height:100%;will-change:transform;transition:transform .55s cubic-bezier(.22,.8,.24,1)}
@media (prefers-reduced-motion:reduce){.track,.win{transition:none}}

/* election markers */
.mk{position:absolute;top:6px;bottom:var(--info-h);width:0;display:flex;flex-direction:column;align-items:center;z-index:1}
.mk::after{content:"";position:absolute;top:calc(var(--mk-h) - 6px);bottom:var(--banner-h);left:-1px;border-left:2px dotted var(--rule)}
.mk .lab{text-align:center;white-space:nowrap;font-family:var(--cond);line-height:1}
.mk .of{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.mk .yr{font-size:28px;font-weight:500;display:block;margin-top:2px}
.mk.future{opacity:.38}
.mk .tags{display:flex;gap:4px;margin-top:5px;position:relative;z-index:2}
.mapbtn{display:inline-flex;align-items:center;gap:5px;font-family:var(--cond);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 9px 3px 7px;border-radius:12px;border:1.5px solid var(--ink);background:var(--paper);cursor:pointer;white-space:nowrap}
.mapbtn:hover{background:var(--ink);color:var(--paper)}
.mapbtn svg{width:15px;height:11px}
.poptag{font-family:var(--cond);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-d);white-space:nowrap;
  border:1.5px dashed var(--amber);border-radius:12px;padding:2px 7px;background:var(--paper)}

/* slots */
.slot{position:absolute;top:0;bottom:0;display:flex;flex-direction:column}
.portraits{flex:1;display:flex;align-items:flex-end;justify-content:center;padding:calc(var(--mk-h) + 6px) 34px 0;min-height:0}
.pf{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;border:none;background:none;padding:0;cursor:pointer;min-width:0}
.pf img{display:block;max-height:100%;max-width:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 4px 6px rgba(60,40,10,.18));transition:transform .2s}
.pf:hover img{transform:translateY(-3px)}
.pf:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.two .pf{max-width:54%} .two .pf+.pf{margin-left:-5%}
.fallback{width:min(70%,180px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;margin-bottom:10px;
  font-family:var(--cond);font-size:44px;font-weight:500;color:#fff;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.banner{height:var(--banner-h);margin:0 3px;display:flex;position:relative;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%,18px 50%)}
.seg{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 22px;border:none;cursor:pointer;min-width:0;
  font-family:var(--cond);white-space:nowrap;overflow:hidden}
.seg .fn{font-size:15px;font-weight:400}
.seg .ln{font-size:clamp(20px,calc(var(--slot)*.075),27px);font-weight:500}
.seg:hover{filter:brightness(1.07)}
.seg:focus-visible{outline:3px solid var(--ink);outline-offset:-5px}
.zig{position:absolute;top:0;height:100%;width:14px;transform:translateX(-50%);pointer-events:none}
.info{height:var(--info-h);padding:7px 22px 0;font-size:14px;line-height:1.35;overflow:hidden}
.yrs{font-family:var(--cond);font-size:15px;letter-spacing:.05em;color:var(--ink-2)}
.share{display:flex;gap:3px;height:7px;margin:5px 0 3px}
.share i{display:block;border-radius:2px;min-width:4px}
.sharelab{display:flex;justify-content:space-between;gap:10px;font-family:var(--cond);font-size:12.5px;color:var(--ink-2);letter-spacing:.02em;white-space:nowrap}
.sharelab span{overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:2;font-family:var(--cond);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.opp{margin-top:4px;color:var(--ink-2)}
.opp .k{font-family:var(--cond);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.opp b{font-weight:600;color:var(--ink)}

/* ---------- lanes ---------- */
.lane-labels{display:flex;flex-direction:column;align-items:flex-end;padding-right:10px;border-top:2px solid var(--ink)}
.lane-labels .sh{display:none}
.lane-labels div{font-family:var(--cond);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;text-align:right;line-height:1.1}
.lanes-vp{border-top:2px solid var(--ink)}
.lane-end{border-top:2px solid var(--ink)}
.era{position:absolute;top:6px;height:26px;border-radius:3px;overflow:hidden}
.era:nth-child(odd){background:var(--paper-3)} .era:nth-child(even){background:var(--paper-2)}
.era.dark{background:#5A4F42}
.era-l{position:absolute;top:0;height:26px;line-height:26px;font-family:var(--cond);font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;color:var(--ink-2);pointer-events:none;transition:left .55s cubic-bezier(.22,.8,.24,1)}
.era-l.on-dark{color:var(--paper)}
.lane-rule{position:absolute;left:0;right:0;height:1px;background:var(--rule)}
.it{position:absolute;height:24px;display:flex;align-items:center;gap:6px;border:none;background:none;padding:0;cursor:pointer;white-space:nowrap;
  font-family:var(--cond);font-size:13.5px;letter-spacing:.02em;color:var(--ink)}
.it .dot{width:11px;height:11px;border-radius:50%;flex:none;border:2px solid var(--paper);box-shadow:0 0 0 1.5px currentColor}
.it .bar{position:absolute;left:0;top:4px;height:16px;border-radius:3px;opacity:.9}
.it.span .t{position:relative;padding-left:7px;z-index:1;transition:transform .55s cubic-bezier(.22,.8,.24,1)}
.it:hover .t{text-decoration:underline;text-underline-offset:3px}
.it:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px}
.k-war{color:#6A5C4C} .k-war .bar{background:repeating-linear-gradient(135deg,#8B7C69 0 5px,#7A6B58 5px 10px)} .k-war.span .t{color:#fff}
.k-land{color:#5D7A3E} .k-land .dot{background:#5D7A3E}
.k-econ{color:#A8701F} .k-econ .dot{background:#C08A36}
.k-event{color:var(--ink-2)} .k-event .dot{background:var(--ink-2)}
.k-event.span .bar{background:#9B8E7C} .k-event.span .t{color:#fff}
.it .dia{width:11px;height:11px;transform:rotate(45deg);flex:none;border-radius:2px}
.k-amend .dia{background:#5E4A86} .k-law .dia{background:#2F6A6A} .k-court .dia{background:#8A3E3E} .k-realign .dia{background:var(--amber)}
.k-amend,.k-law,.k-court,.k-realign{color:var(--ink)}
.mini-key{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 7px;margin-top:3px;letter-spacing:.04em;text-transform:none;font-size:11px}
.mini-key span{display:inline-flex;align-items:center;gap:3px}
.mini-key i{display:inline-block;width:8px;height:8px;border-radius:50%}
.mini-key i.d{border-radius:1px;transform:rotate(45deg)}

.foot{display:flex;justify-content:space-between;align-items:center;gap:6px 20px;flex-wrap:wrap;padding:6px 28px 10px;font-size:12px;color:var(--muted)}
.fkey{display:flex;flex-wrap:wrap;gap:3px 12px;font-family:var(--cond);font-size:12.5px;letter-spacing:.04em;color:var(--ink-2)}
.fkey span{display:inline-flex;align-items:center;gap:5px}
.fkey i{display:inline-block;width:9px;height:9px;border-radius:50%}
.fkey i.d{border-radius:1px;transform:rotate(45deg)}
.fkey i.w{width:16px;height:8px;border-radius:2px;background:repeating-linear-gradient(135deg,#8B7C69 0 3px,#7A6B58 3px 6px)}
.fkey .sep{width:1px;height:12px;background:var(--rule)}
.foot kbd{font-family:var(--cond);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--paper)}

/* ---------- popover ---------- */
.pop{position:fixed;z-index:40;max-width:320px;background:#FFFBF3;border:1.5px solid var(--ink);border-radius:8px;padding:10px 14px 12px;
  box-shadow:0 8px 24px rgba(40,25,5,.22);font-size:14.5px;line-height:1.45}
.pop .py{font-family:var(--cond);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pop .pt{font-family:var(--cond);font-size:19px;font-weight:500;margin:1px 0 4px;line-height:1.15}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(42,37,31,.55);backdrop-filter:blur(2px)}
.modal[hidden]{display:none}
.card{position:relative;background:var(--paper);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:calc(100vh - 40px);overflow:auto;
  background-image:repeating-linear-gradient(135deg, rgba(120,100,70,.03) 0 1px, transparent 1px 9px)}
.close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:none;background:var(--ink);color:var(--paper);cursor:pointer;display:grid;place-items:center;z-index:2}
.close:hover{background:var(--amber-d)}
.close:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.pcard{width:min(860px,100%);display:grid;grid-template-columns:minmax(200px,300px) 1fr}
.pcard .pic{display:flex;align-items:flex-end;justify-content:center;padding:28px 10px 0;border-radius:12px 0 0 12px;min-height:320px;position:relative;overflow:hidden}
.pcard .pic::before{content:"";position:absolute;inset:0;background:var(--pc);opacity:.85}
.pcard .pic img{position:relative;max-width:100%;max-height:380px;display:block}
.pcard .txt{padding:30px 34px 30px 30px}
.pcard .ordl{font-family:var(--cond);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pcard h2{font-family:var(--cond);font-weight:500;font-size:40px;line-height:1.05;margin:4px 0 10px}
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--cond);font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px 3px 8px;border-radius:14px;background:var(--paper-2)}
.chip b{width:12px;height:12px;border-radius:3px;display:inline-block}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0;font-size:14.5px}
.facts dt{font-family:var(--cond);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.facts dd{margin:0}
.pcard p{font-size:16.5px;line-height:1.6;margin:0 0 12px}
.pcard .fnote{font-size:14px;font-style:italic;color:var(--ink-2);border-left:3px solid var(--amber);padding-left:10px}
.mcard{width:min(1180px,100%);padding:26px 28px 22px}
.mcard h2{font-family:var(--cond);font-weight:500;font-size:34px;line-height:1;margin:0 0 4px;text-transform:uppercase;letter-spacing:.02em}
.mcard .sub{font-family:var(--cond);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.mgrid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr);gap:26px;align-items:start}
.mapsvg{width:100%;height:auto;display:block}
.mapsvg path{stroke:#FBF6EC;stroke-width:1.1;stroke-linejoin:round}
.mapsvg path:hover{filter:brightness(1.1)}
.mapsvg .disp{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-dasharray:6 4;pointer-events:none}
.cands{display:grid;gap:8px;margin-bottom:12px}
.cand{display:grid;grid-template-columns:16px 1fr auto;gap:2px 10px;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.45)}
.cand.won{background:#fff;box-shadow:0 0 0 1.5px var(--ink)}
.cand .sw{width:16px;height:16px;border-radius:4px;grid-row:span 2}
.cand .nm{font-family:var(--cond);font-size:18px;font-weight:500;line-height:1.1}
.cand .pty{font-size:12.5px;color:var(--muted);grid-column:2}
.cand .ev{font-family:var(--cond);font-size:24px;font-weight:500;text-align:right;grid-row:1;grid-column:3;line-height:1}
.cand .pv{font-size:12.5px;color:var(--muted);text-align:right;grid-column:3;grid-row:2}
.mkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin:4px 0 12px}
.mkey span{display:inline-flex;align-items:center;gap:6px}
.mkey i{display:inline-block;width:16px;height:12px;border-radius:2px}
.mnote{font-size:15.5px;line-height:1.6;margin:0 0 8px}
.msmall{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0 0 4px}
.mtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);font-family:var(--cond);font-size:13px;letter-spacing:.03em;padding:4px 9px;border-radius:5px;white-space:nowrap}

@media (max-width:900px){
  .stage{grid-template-columns:56px minmax(0,1fr) 56px}
  .nav{width:48px;height:48px} .nav svg{width:22px;height:22px}
  .pcard{grid-template-columns:1fr} .pcard .pic{border-radius:12px 12px 0 0;min-height:240px} .pcard .pic img{max-height:260px}
  .mgrid{grid-template-columns:1fr}
  .lane-labels .lg{display:none} .lane-labels .sh{display:inline} .lane-labels div{font-size:10.5px;letter-spacing:.08em}
}
@media (max-width:1100px){ .top{flex-wrap:wrap} .legend{order:3;flex-basis:100%;justify-content:flex-start;padding-bottom:0} }
@media (max-width:600px){ .top{padding:12px 16px 6px} .strip-wrap,.foot{padding-left:16px;padding-right:16px} .range .lbl{display:none} }
</style>
</head>
<body>
<header class="top">
  <div>
    <div class="kicker">Mr. Huebner's American Government</div>
    <h1>Timeline of Presidents</h1>
    <div class="dashes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="legend" id="legend" aria-label="Party colors"></div>
  <div class="range" aria-live="polite"><span class="lbl">Now showing</span><span class="val" id="range"></span></div>
</header>

<section class="strip-wrap" aria-label="All 60 presidential terms, colored by party">
  <div class="strip" id="strip"><div class="win" id="win"></div></div>
  <div class="ticks" id="ticks"></div>
</section>

<main class="stage" id="stage">
  <button class="nav" id="prev" aria-label="Back one term"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
  <div class="vp stage-vp" id="vp"><div class="track" id="track"></div></div>
  <button class="nav" id="next" aria-label="Forward one term"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg></button>

  <div class="lane-labels" id="laneLabels"></div>
  <div class="vp lanes-vp" id="lvp"><div class="track" id="ltrack"></div></div>
  <div class="lane-end"></div>
</main>

<footer class="foot">
  <div class="fkey"><span><i class="w"></i>War</span><span><i style="background:#5D7A3E"></i>Land</span><span><i style="background:#C08A36"></i>Economy</span><span><i style="background:var(--ink-2)"></i>Event</span><span class="sep"></span><span><i class="d" style="background:#5E4A86"></i>Amendment</span><span><i class="d" style="background:#2F6A6A"></i>Law</span><span><i class="d" style="background:#8A3E3E"></i>Court case</span><span><i class="d" style="background:#B47A2E"></i>Parties</span></div>
  <span>Click portraits, maps, and timeline items for details. <kbd>&larr;</kbd> <kbd>&rarr;</kbd> keys work too.</span>
</footer>

<div class="pop" id="pop" role="dialog" hidden></div>

<div class="modal" id="pmodal" hidden>
  <div class="card pcard" role="dialog" aria-modal="true" aria-labelledby="pname">
    <button class="close" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="pic" id="ppic"></div>
    <div class="txt" id="ptxt"></div>
  </div>
</div>

strip.addEventListener("pointerdown", e => { stripDrag = true; strip.setPointerCapture(e.pointerId); go(stripIndexAt(e.clientX) - Math.floor(VIS/2)); });
strip.addEventListener("pointermove", e => { if (stripDrag) go(stripIndexAt(e.clientX) - Math.floor(VIS/2)); });
["pointerup","pointercancel","lostpointercapture"].forEach(t => strip.addEventListener(t, () => stripDrag = false));

/* ---------- build stage ---------- */
const track = $("track"), ltrack = $("ltrack");
function buildStage(){
  track.innerHTML = "";
  for (let k = 0; k <= N; k++){
    const year = k < N ? S[k].e : S[N-1].e + 4;
    const m = el("div", "mk" + (k === N ? " future" : ""));
    m.style.left = (k * slotW) + "px";
    m.innerHTML = `<div class="lab"><span class="of">Election of</span><span class="yr">${year}</span></div>`;
    const tags = el("div", "tags");
    if (k < N && MAPS[year]){
      const b = el("button", "mapbtn", `<svg viewBox="0 0 15 11" fill="currentColor"><path d="M1 2l4-1 2 1 3-.5 4 1-.5 3 .5 2-2 2-3-.5-1.5 1-1.5-1.5L3 9 1.5 7 1 4.5z"/></svg>Map`);
      b.setAttribute("aria-label", "Open the electoral map for " + year);
      b.addEventListener("click", ev => { ev.stopPropagation(); openMap(year, b); });
      tags.appendChild(b);
    }
    if (k < N && S[k].popLoss) tags.appendChild(el("span", "poptag", "Lost popular vote"));
    if (tags.children.length) m.appendChild(tags);
    track.appendChild(m);
  }
  S.forEach((s, i) => {
    const slot = el("div", "slot");
    slot.style.left = (i * slotW) + "px"; slot.style.width = slotW + "px";
    const pics = el("div", "portraits" + (s.who.length > 1 ? " two" : ""));
    const ban = el("div", "banner");
    s.who.forEach((w, j) => {
      const id = w[0], pr = P[id];
      const f = el("button", "pf"); f.setAttribute("aria-label", "More about " + fullName(id));
      const img = new Image(); img.alt = fullName(id); img.decoding = "async";
      img.src = IMG_DIR + (w[4] || id) + ".webp";
      img.addEventListener("error", () => {
        const fb = el("div", "fallback", (pr.first[0] + pr.last[0]).toUpperCase());
        fb.style.background = PARTY[pr.party].c; img.replaceWith(fb);
      });
      f.appendChild(img); f.addEventListener("click", () => openPres(id, w[4], f));
      if (w[3]){ const d = pDate(w[2]); f.appendChild(el("span", "badge", ENDWORD[w[3]] + " " + d.getUTCFullYear())); }
      pics.appendChild(f);
      const seg = el("button", "seg");
      seg.style.background = PARTY[pr.party].c; seg.style.color = PARTY[pr.party].txt;
      seg.innerHTML = s.who.length > 1 ? `<span class="ln">${esc(pr.last)}</span>` : `<span class="fn">${esc(pr.first)}</span><span class="ln">${esc(pr.last)}</span>`;
      seg.setAttribute("aria-label", "More about " + fullName(id));
      seg.addEventListener("click", () => openPres(id, w[4], seg));
      ban.appendChild(seg);
    });
    if (s.who.length > 1){
      const z = el("div", "zig"); z.style.left = "50%";
      z.innerHTML = `<svg viewBox="0 0 14 48" preserveAspectRatio="none" width="14" height="100%"><path d="M9 0 L3 17 L10 22 L4 48" fill="none" stroke="#FBF6EC" stroke-width="3" stroke-linejoin="round"/></svg>`;
      ban.appendChild(z);
    }
    const info = el("div", "info");
    const first = s.who[0], last = s.who[s.who.length-1];
    let h = `<div class="yrs">${first[1].slice(0,4)}-${last[2].slice(0,4)}</div>`;
    if (s.who.length > 1){
      const tot = pDate(last[2]) - pDate(first[1]);
      h += `<div class="share">` + s.who.map(w => `<i style="flex:${(pDate(w[2]) - pDate(w[1])) / tot};background:${PARTY[P[w[0]].party].c}"></i>`).join("") + `</div>`;
      h += `<div class="sharelab">` + s.who.map(w => `<span>${esc(P[w[0]].last)}: ${spanText(w[1], w[2], true)}</span>`).join("") + `</div>`;
    }
    const opp = Array.isArray(s.opp) ? s.opp.map(o => WAS_PRES.includes(o) ? `<b>${esc(o)}</b>` : esc(o)).join(", ") : esc(s.opp);
    h += `<div class="opp">${Array.isArray(s.opp) ? '<span class="k">Defeated</span>' : ""}${opp}</div>`;
    info.innerHTML = h;
    slot.append(pics, ban, info);
    track.appendChild(slot);
  });
  track.style.width = (N * slotW) + "px";
}

/* ---------- build lanes ---------- */
const LANES = [
  {key:"era", label:"Era"},
  {key:"ev", label:"Events", items:EVENTS},
  {key:"ms", label:'<span class="lg">Government</span><span class="sh">Gov\'t</span>', items:MILESTONES}
];
const ROW = 27;
let measureCtx;
function textW(t){ if (!measureCtx){ measureCtx = document.createElement("canvas").getContext("2d"); } measureCtx.font = '13.5px Oswald, "Arial Narrow", sans-serif'; return measureCtx.measureText(t).width; }
let eraEls = [], spanEls = [];
function buildLanes(){
  ltrack.innerHTML = ""; eraEls = []; spanEls = [];
  ltrack.style.width = (N * slotW) + "px";
  let top = 0;
  const labels = $("laneLabels"); labels.innerHTML = "";
  // eras
  ERAS.forEach(([a, b, name]) => {
    const x1 = yToX(a), x2 = yToX(b);
    const e = el("div", "era" + (/(Civil War|World War II)/.test(name) ? " dark" : ""));
    e.style.left = x1 + "px"; e.style.width = (x2 - x1 - 2) + "px";
    const l = el("div", "era-l" + (/(Civil War|World War II)/.test(name) ? " on-dark" : ""), esc(name));
    ltrack.append(e, l);
    l.style.top = "6px";
    eraEls.push({x1, x2, l, w: textW(name.toUpperCase()) * 1.15 + 10});
  });
  top = 38;
  const lab0 = el("div", null, "Era"); lab0.style.height = top + "px"; labels.appendChild(lab0);
  LANES.slice(1).forEach(lane => {
    const placed = lane.items.map(it => {
      const x = yToX(it.y), xEnd = it.y2 ? yToX(it.y2) : x;
      const lw = textW(it.t) + 6;
      const w = it.y2 ? Math.max(xEnd - x, lw + 14) : lw + 18;
      return {it, x, xEnd, w};
    }).sort((a, b) => a.x - b.x);
    const ends = [];
    placed.forEach(p => {
      let r = ends.findIndex(e => e + 8 <= p.x - 6);
      if (r < 0){ if (ends.length < 4) r = ends.length; else r = ends.indexOf(Math.min(...ends)); }
      ends[r] = p.x - 6 + p.w; p.row = r;
    });
    const rows = Math.max(1, ends.length);
    const h = rows * ROW + 10;
    const rule = el("div", "lane-rule"); rule.style.top = top + "px"; ltrack.appendChild(rule);
    placed.forEach(p => {
      const it = p.it, isSpan = !!it.y2;
      const b = el("button", `it k-${it.k}${isSpan ? " span" : ""}`);
      b.style.top = (top + 6 + p.row * ROW) + "px";
      if (isSpan){
        b.style.left = p.x + "px";
        const bw = Math.max(p.xEnd - p.x, 6);
        b.innerHTML = `<span class="bar" style="width:${bw}px"></span><span class="t">${esc(it.t)}</span>`;
        if (bw < textW(it.t) + 14){ b.querySelector(".t").style.color = "inherit"; b.querySelector(".t").style.paddingLeft = (bw + 6) + "px"; }
        else spanEls.push({x:p.x, room: bw - textW(it.t) - 16, t:b.querySelector(".t")});
      } else {
        b.style.left = (p.x - 6) + "px";
        const mark = lane.key === "ms" ? `<span class="dia"></span>` : `<span class="dot"></span>`;
        b.innerHTML = `${mark}<span class="t">${esc(it.t)}</span>`;
      }
      b.addEventListener("click", ev => { ev.stopPropagation(); showPop(it, b); });
      ltrack.appendChild(b);
    });
    const lab = el("div", null, lane.label);
    lab.style.height = h + "px"; lab.style.flexDirection = "column"; lab.style.alignItems = "flex-end"; lab.style.justifyContent = "center";
    labels.appendChild(lab);
    top += h;
  });
  $("lvp").style.height = top + "px";
}
function placeEraLabels(){
  const v1 = idx * slotW - PAD, v2 = v1 + $("lvp").clientWidth;
  spanEls.forEach(e => { const sh = Math.max(0, Math.min(e.room, v1 + PAD * .7 - e.x)); e.t.style.transform = `translateX(${sh}px)`; });
  eraEls.forEach(e => {
    const a = Math.max(e.x1, v1 + PAD * .6), b = Math.min(e.x2, v2 - PAD * .6);
    let x;
    if (b - a >= e.w) x = Math.min(Math.max((a + b) / 2 - e.w / 2, a + 4), b - e.w);
    else x = (e.x1 + e.x2) / 2 - e.w / 2;
    e.l.style.left = Math.max(e.x1 + 4, Math.min(x, e.x2 - e.w)) + "px";
    e.l.style.opacity = (e.x2 - e.x1) < e.w * .8 ? 0 : 1;
  });
}

/* ---------- layout + navigation ---------- */
function layout(){
  const vpW = $("vp").clientWidth;
  VIS = vpW >= 820 ? 3 : vpW >= 520 ? 2 : 1;
  PAD = Math.round(Math.min(70, Math.max(30, vpW * .055)));
  slotW = (vpW - 2 * PAD) / VIS;
  document.documentElement.style.setProperty("--pad", PAD + "px");
  document.documentElement.style.setProperty("--slot", slotW + "px");
  buildStage(); buildLanes();
  go(idx, true);
}
function go(i, instant){
  idx = Math.max(0, Math.min(N - VIS, i));
  const tx = `translateX(${PAD - idx * slotW}px)`;
  [track, ltrack].forEach(t => { if (instant) t.style.transition = "none"; t.style.transform = tx; if (instant){ t.offsetHeight; t.style.transition = ""; } });
  const win = $("win"); win.style.left = `calc(${idx / N * 100}% + ${-1}px)`; win.style.width = `calc(${VIS / N * 100}% + 2px)`;
  const a = S[idx].who[0][1].slice(0,4), last = S[idx + VIS - 1].who, b = last[last.length-1][2].slice(0,4);
  $("range").textContent = a + " to " + b;
  $("prev").disabled = idx === 0; $("next").disabled = idx >= N - VIS;
  placeEraLabels(); hidePop();
  try { history.replaceState(null, "", "#" + S[idx].e); } catch(e){}
}
$("prev").addEventListener("click", () => go(idx - 1));
$("next").addEventListener("click", () => go(idx + 1));
document.addEventListener("keydown", e => {
  if (!$("pmodal").hidden || !$("mmodal").hidden){ if (e.key === "Escape") closeModals(); return; }
  if (e.key === "Escape") hidePop();
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (e.key === "ArrowRight"){ go(idx + (e.shiftKey ? VIS : 1)); e.preventDefault(); }
  if (e.key === "ArrowLeft"){ go(idx - (e.shiftKey ? VIS : 1)); e.preventDefault(); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(N);
});
/* swipe */
(function(){
  let sx = null, sy = 0, moved = false;
  const vp = $("vp");
  vp.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") return; sx = e.clientX; sy = e.clientY; moved = false; });
  vp.addEventListener("pointermove", e => { if (sx !== null && Math.abs(e.clientX - sx) > 12) moved = true; });
  vp.addEventListener("pointerup", e => {
    if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(idx + (dx < 0 ? 1 : -1));
  });
  vp.addEventListener("click", e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 120); });

/* ---------- popover ---------- */
const pop = $("pop"); let popFor = null;
function fmtYear(it){ const a = Math.floor(it.y); if (!it.y2) return a; const b = Math.floor(it.y2); return a === b ? a : a + "-" + b; }
function showPop(it, anchor){
  if (popFor === anchor){ hidePop(); return; }
  popFor = anchor;
  pop.innerHTML = `<div class="py">${fmtYear(it)}</div><div class="pt">${esc(it.t)}</div><div>${esc(it.d)}</div>`;
  pop.hidden = false;
  const r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = Math.min(Math.max(10, r.left), innerWidth - pw - 10);
  let y = r.top - ph - 8; if (y < 10) y = r.bottom + 8;
  pop.style.left = x + "px"; pop.style.top = y + "px";
}
function hidePop(){ pop.hidden = true; popFor = null; }
document.addEventListener("click", e => { if (!pop.hidden && !pop.contains(e.target)) hidePop(); });

/* ---------- modals ---------- */
let lastFocus = null;
function openModal(m, from){ lastFocus = from || document.activeElement; hidePop(); m.hidden = false; m.querySelector("[data-close]").focus(); }
function closeModals(){ $("pmodal").hidden = true; $("mmodal").hidden = true; $("mtip").hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModals));
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m) closeModals(); }));

function openPres(id, imgOverride, from){
  const p = P[id], pt = PARTY[p.party];
  const mine = S.filter(s => s.who.some(w => w[0] === id));
  const ranges = []; // merge consecutive slots
  S.forEach(s => s.who.forEach(w => { if (w[0] !== id) return; const L = ranges[ranges.length-1]; if (L && L.end === w[1]) L.end = w[2]; else ranges.push({start:w[1], end:w[2]}); }));
  const served = ranges.map(r => r.start.slice(0,4) + "-" + (pDate(r.end) > new Date() ? "present" : r.end.slice(0,4))).join(" and ");
  const won = mine.filter(s => s.who[0][0] === id).map(s => s.e);
  $("ppic").style.setProperty("--pc", pt.c);
  $("ppic").innerHTML = "";
  const img = new Image(); img.alt = fullName(id); img.src = IMG_DIR + (imgOverride || id) + ".webp";
  img.addEventListener("error", () => { img.replaceWith(el("div", "fallback", (p.first[0] + p.last[0]).toUpperCase())); });
  $("ppic").appendChild(img);
  $("ptxt").innerHTML = `
    <div class="ordl">The ${ordinal(p.ord)} President</div>
    <h2 id="pname">${esc(fullName(id))}</h2>
    <span class="chip"><b style="background:${pt.c}"></b>${pt.name}</span>
    <dl class="facts"><dt>Served</dt><dd>${served}</dd><dt>Elected</dt><dd>${won.length ? won.join(", ") : "Never elected president. Took over when the president " + ({died:"died",assassinated:"was assassinated",resigned:"resigned"}[S.find(s => s.who[1] && s.who[1][0] === id).who[0][3]]) + "."}</dd></dl>
    <p>${esc(p.sum)}</p>
    ${p.foot ? `<div class="fnote">${esc(p.foot)}</div>` : ""}`;
  openModal($("pmodal"), from);
}

/* ---------- electoral maps ---------- */
const SVGNS = "http://www.w3.org/2000/svg";
function resultFor(m, code, year){
  if (m.states[code] !== undefined) return m.states[code];
  if (m.partOf && m.partOf[code]) return m.states[m.partOf[code]];
  if (code === "DC") return m.dc;
  if (m.all && ADMIT[code] <= year) return m.all;
  return undefined;
}
function openMap(year, from){
  const m = MAPS[year], svg = $("msvg");
  const keys = Object.keys(m.cands);
  const winKey = m.win || keys.reduce((a, b) => m.cands[a][3] >= m.cands[b][3] ? a : b);
  $("mtitle").textContent = "Election of " + year;
  const total = keys.reduce((t, k) => t + m.cands[k][3], 0);
  $("msub").textContent = m.sub || (m.cands[winKey][0] + " wins, " + m.cands[winKey][3] + " electoral votes of " + total + (m.evNote ? " cast" : ""));
  svg.innerHTML = "";
  const defs = document.createElementNS(SVGNS, "defs"); svg.appendChild(defs);
  const madePat = {};
  const fillFor = r => {
    if (r === undefined) return "#E2D7C1";
    if (typeof r === "string") return m.cands[r][2];
    const ks = Object.keys(r).sort((a, b) => r[b] - r[a]).slice(0, 2);
    const id = "sp-" + year + "-" + ks.join("-");
    if (!madePat[id]){
      const pat = document.createElementNS(SVGNS, "pattern");
      pat.setAttribute("id", id); pat.setAttribute("patternUnits", "userSpaceOnUse"); pat.setAttribute("width", 9); pat.setAttribute("height", 9); pat.setAttribute("patternTransform", "rotate(45)");
      pat.innerHTML = `<rect width="9" height="9" fill="${m.cands[ks[0]][2]}"/><rect width="4" height="9" fill="${m.cands[ks[1]][2]}"/>`;
      defs.appendChild(pat); madePat[id] = 1;
    }
    return `url(#${id})`;
  };
  const describe = (code, r) => {
    let nm = STATE_NAMES[code];
    if (m.partOf && m.partOf[code]) nm += " (part of " + STATE_NAMES[m.partOf[code]] + ")";
    if (r === undefined) return nm + ": not a state yet";
    if (typeof r === "string") return nm + ": " + m.cands[r][0];
    return nm + ": split, " + Object.keys(r).sort((a, b) => r[b] - r[a]).map(k => m.cands[k][0].split(" ").slice(-1)[0] + " " + r[k]).join(", ");
  };
  const tip = $("mtip");
  Object.entries(GEO.states).forEach(([code, d]) => {
    const r = resultFor(m, code, year);
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", d); p.setAttribute("fill", fillFor(r));
    const label = describe(code, r);
    p.setAttribute("aria-label", label);
    p.addEventListener("pointermove", e => { tip.textContent = label; tip.hidden = false; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY - 34) + "px"; });
    p.addEventListener("pointerleave", () => tip.hidden = true);
    svg.appendChild(p);
  });
  (m.disputed || []).forEach(code => { const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", GEO.states[code]); p.setAttribute("class", "disp"); svg.appendChild(p); });
  svg.setAttribute("aria-label", "Electoral map of the " + year + " election");

  const hasSplit = Object.values(m.states).some(v => typeof v === "object");
  const hasGray = Object.keys(GEO.states).some(c => resultFor(m, c, year) === undefined);
  let side = `<div class="cands">` + keys.sort((a, b) => m.cands[b][3] - m.cands[a][3]).map(k => { const c = m.cands[k]; return `
    <div class="cand${k === winKey ? " won" : ""}"><span class="sw" style="background:${c[2]}"></span><span class="nm">${esc(c[0])}</span><span class="ev">${c[3]}</span><span class="pty">${esc(c[1])}</span><span class="pv">${c[4]} popular</span></div>`; }).join("") + `</div>`;
  side += `<div class="mkey"><span><i style="background:#7a7a7a"></i>Electoral votes</span>`;
  if (hasSplit) side += `<span><i style="background:repeating-linear-gradient(45deg,#8a8172 0 3px,#cfc5b3 3px 6px)"></i>Split electoral votes</span>`;
  if (m.disputed) side += `<span><i style="border:2px dashed var(--ink);background:transparent"></i>Disputed</span>`;
  if (hasGray) side += `<span><i style="background:#E2D7C1"></i>Not a state yet</span>`;
  side += `</div>`;
  side = side.replace(`<span><i style="background:#7a7a7a"></i>Electoral votes</span>`, "");
  side += `<p class="mnote">${esc(m.note)}</p>`;
  if (m.partOf && m.partOf.ME) side += `<p class="msmall">Maine was part of Massachusetts until 1820.</p>`;
  if (m.partOf && m.partOf.WV) side += `<p class="msmall">West Virginia was part of Virginia until 1863.</p>`;
  if (m.popNote) side += `<p class="msmall">${esc(m.popNote)}</p>`;
  if (m.evNote) side += `<p class="msmall">${esc(m.evNote)}</p>`;
  if (year >= 1964) side += `<p class="msmall">Washington, D.C., has voted since 1964 (23rd Amendment). It is too small to see on the map.</p>`;
  side += `<p class="msmall">Sources: Wikipedia state-by-state results${year === 2024 ? " and the National Archives" : ""}. Map outlines: U.S. Census Bureau.</p>`;
  $("mside").innerHTML = side;
  openModal($("mmodal"), from);
}

/* ---------- start ---------- */
const startYear = parseInt((location.hash || "").slice(1), 10);
if (startYear){ const i = S.findIndex(s => s.e === startYear); if (i >= 0) idx = i; }
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
</script>
