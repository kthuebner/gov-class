*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--parchment);color:var(--ink);
  font-family:'Lora',Georgia,serif;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font-family:inherit}

/* ---------- header ---------- */
header{
  background:var(--green);color:#fff;flex:0 0 auto;
  display:flex;align-items:center;gap:22px;
  padding:8px 16px 9px;
}
.brand h1{
  font-family:'Oswald',Impact,sans-serif;font-weight:600;
  text-transform:uppercase;letter-spacing:.055em;
  font-size:clamp(15px,1.5vw,21px);margin:0;line-height:1.05;
}
.brand .sub{
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  font-family:'Oswald',sans-serif;font-weight:400;opacity:.82;margin-top:2px;
}
.dashes{display:flex;gap:6px;margin-top:5px}

}

  0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}

.tray{

<script>
const W=5043,H=2982,AR=W/H;
const R=(x0,y0,x1,y1)=>({l:x0/W*100,t:y0/H*100,w:(x1-x0)/W*100,h:(y1-y0)/H*100});
const TAG=(cx,cy,len,ang)=>({cx:cx/W*100,cy:cy/H*100,w:len/W*100,h:57/H*100,ang:ang});

const NODES=[
/* ---- phase bands ---- */
{id:'phase1',tone:'p1',rect:R(96,2196,1560,2265),eyebrow:'Phase 1',title:'Introduction',
 body:['Anyone can write a bill, but only a member of Congress can introduce one. That single rule is why lobbyists, agencies, think tanks, and ordinary constituents all spend their time trying to find a member willing to put a name on their idea.',
 'Steps 1 and 2 are cheap and fast. That is exactly why so many bills exist and so few matter. Introduction is a position statement as often as it is a serious attempt to legislate.']},
{id:'phase2',tone:'p2',rect:R(984,1539,2664,1608),eyebrow:'Phase 2',title:'Committee Work',
 body:['Committees are where the real legislating happens and where almost all of it stops. A subcommittee or committee holds hearings, marks up the text line by line, and votes on whether to report the bill to the full chamber.',
 'Roughly nine out of ten introduced bills never get a committee vote. If you only remember one thing about this chart, remember that the deadliest part of it is the middle, not the president.']},
{id:'phase3',tone:'p3',rect:R(2380,825,4631,894),eyebrow:'Phase 3',title:'Floor Action',
 body:['Floor action looks like the democratic part of the process, but the rules of the two chambers make it two different games. The House runs on majority control of time. The Senate runs on individual leverage and the sixty vote threshold.',
 'A bill that clears committee can still sit on a calendar forever, because in both chambers the majority leadership decides what comes up and when.']},
{id:'phase4',tone:'p4',rect:R(4061,112,4980,181),eyebrow:'Phase 4',title:'Presidential Action',
 body:['The president has ten days, Sundays excepted, to act on a bill. Sign it, veto it, or do nothing. Doing nothing while Congress is in session lets it become law without a signature. Doing nothing after Congress adjourns kills it, which is the pocket veto.',
 'The veto threat shapes bills long before this step. Committees and leaders write around it, because overriding a veto takes two thirds of both chambers and that almost never comes together.']},

/* ---- the path ---- */
{id:'start',tone:'p1',rect:R(90,2305,450,2735),eyebrow:'Start',title:'It Is an Idea',
 body:['Ideas come from everywhere: a member of Congress, the White House, an executive agency, a state legislature, an interest group, a company, a class of high school students who write to their representative.',
 'The origin of an idea carries no legal weight. What matters is whether a member of Congress will introduce it.'],
 note:['One constitutional exception','All bills for raising revenue must start in the House of Representatives. Article I, Section 7. The Senate can amend them freely, which blunts the rule in practice.']},

{id:'step1',tone:'p1',rect:R(470,2305,958,2736),eyebrow:'Step 1  |  Phase 1',title:'Idea Becomes a Bill',
 body:['Drafting is technical work. Members lean on the Office of Legislative Counsel, on committee staff, and often on text handed to them by an agency or an interest group that wants the bill.',
 'Word choice here decides which committee gets the bill later, so drafters write with jurisdiction in mind. Calling something a tax instead of a fee can send it to a completely different committee and change its odds of survival.']},

{id:'step2',tone:'p1',rect:R(1015,2305,1567,2736),eyebrow:'Step 2  |  Phase 1',title:'Bill Introduction',
 body:['In the House the sponsor drops the bill in the hopper, a wooden box at the clerk\u2019s desk. In the Senate a member introduces it from the floor. The bill is numbered in order, H.R. 1 or S. 1 and onward, and printed.',
 'Other members sign on as cosponsors, which costs nothing and signals support. A long cosponsor list is a bargaining chip when the sponsor asks a chair for a hearing.'],
 note:['The numbers','Somewhere between ten and twenty thousand measures are introduced in a two year Congress. A few hundred become law. Everything not enacted dies when that Congress ends and must be introduced all over again.']},

{id:'step3',tone:'p2',rect:R(977,1649,1529,2080),eyebrow:'Step 3  |  Phase 2',title:'Referred to Committee',
 body:['The Speaker refers House bills, advised by the parliamentarian, who matches the text against each committee\u2019s written jurisdiction. Complicated bills can be referred to several committees at once, and each one becomes another place to die.',
 'The chair of the committee then decides whether the bill exists in any practical sense. A chair who never schedules a hearing has killed it without a vote and without a record.']},

{id:'step4',tone:'p2',rect:R(1548,1649,2100,2080),eyebrow:'Step 4  |  Phase 2',title:'Committee Review',
 body:['Hearings come first: supporters, opponents, agency officials, and experts testify. Then comes markup, where members amend the bill line by line and vote on each change. The version that emerges can look nothing like the version introduced.',
 'Most bills never reach markup. They sit, the two year clock runs out, and they disappear.'],
 note:['The escape hatch','A discharge petition can pull a bill out of a committee that refuses to act, but it needs 218 signatures in the House and members rarely defy their own leadership to sign one. Successful discharge petitions are measured in a handful per decade.']},

{id:'step5',tone:'p2',rect:R(2119,1649,2671,2080),eyebrow:'Step 5  |  Phase 2',title:'Committee Vote',
 body:['The committee votes on whether to report the bill to the full chamber. It also writes a committee report explaining what the bill does and why, which courts and agencies later read as evidence of what Congress intended.',
 'A chair usually will not call a vote that will lose, so most bills that get this far are reported favorably. The unfavorable report is technically possible and practically fatal.']},

{id:'step6',tone:'p3',rect:R(2373,935,2925,1366),eyebrow:'Step 6  |  Phase 3',title:'Scheduled for Debate',
 body:['In the House, the Rules Committee writes a special rule for each major bill that sets how long debate runs and which amendments may be offered. A closed rule allows none. The Rules Committee answers to the Speaker, which is what makes the Speaker powerful.',
 'In the Senate there is no equivalent. The majority leader schedules bills and negotiates unanimous consent agreements, which means one senator\u2019s objection can slow the chamber to a crawl.']},

{id:'step7',tone:'p3',rect:R(2944,935,3496,1366),eyebrow:'Step 7  |  Phase 3',title:'Debate and Amendments',
 body:['House debate is short and controlled by the rule. Amendments must be germane, meaning they have to be about the subject of the bill.',
 'Senate debate is unlimited until sixty senators vote for cloture to end it. Senate amendments do not have to be germane, which is how unrelated riders get attached to bills that are going to pass anyway.'],
 note:['The workaround','Budget reconciliation bills cannot be filibustered and pass with a simple majority, but the Byrd rule limits them to provisions with real budget effects. That is why so much major legislation now gets written as a spending or tax bill.']},

{id:'step8',tone:'p3',rect:R(3515,935,4067,1366),eyebrow:'Step 8  |  Phase 3',title:'Floor Vote',
 body:['Amendments are disposed of first, then the chamber votes on final passage. A simple majority of those present and voting carries it: 218 in a full House, 51 in the Senate, or 50 with the vice president breaking the tie.',
 'Leaders count votes before scheduling. A bill pulled from the floor at the last minute is usually a bill that was about to lose.']},

{id:'step9',tone:'p3',rect:R(4086,935,4638,1366),eyebrow:'Step 9  |  Phase 3',title:'Reconciliation',
 body:['Both chambers must pass word for word identical text. If the House and Senate versions differ, the differences have to be settled before the bill can go to the president.',
 'The textbook answer is a conference committee of members from both chambers. In practice conferences have become rare. The chambers now usually amend each other\u2019s bill back and forth until the text matches, a process the Capitol calls ping pong.'],
 note:['Two meanings, one word','Reconciliation here means settling the differences between two versions. Budget reconciliation is a separate fast track process that avoids the filibuster. Same word, different thing.']},

{id:'step10',tone:'p4',rect:R(4054,221,4606,652),eyebrow:'Step 10  |  Phase 4',title:'Presidential Decision',
 body:['Sign it and it is law. Veto it and it goes back to Congress with a written statement of objections. Ignore it for ten days, Sundays excepted, and it becomes law anyway if Congress is still in session.',
 'If Congress adjourns during those ten days and the president has not signed, the bill dies quietly. That is the pocket veto, and it cannot be overridden because there is no chamber in session to override it.'],
 note:['How often overrides work','Of roughly fifteen hundred regular vetoes in American history, Congress has overridden about one hundred ten. Getting two thirds of both chambers to agree on anything the president opposes is the hard part.']},

{id:'finish',tone:'p4',rect:R(4626,221,4986,652),eyebrow:'Finish Line',title:'It Is a Law',
 body:['The bill gets a public law number, such as P.L. 118-5, and goes into the United States Code. Passage is the beginning of the real fight, not the end of it.',
 'Agencies now write the regulations that decide what the law actually does on the ground, Congress decides whether to fund it, and the courts can still strike parts of it down.']},

{id:'loop',tone:'p3',round:true,rect:R(1715,206,2259,750),eyebrow:'The Other Chamber',title:'Back to the Beginning',
 body:['A bill passing the House has finished half a gauntlet. It now starts over in the Senate: referral, committee, markup, committee vote, scheduling, debate, floor vote. Every gate on this chart is waiting for it a second time.',
 'To save time, sponsors often introduce identical companion bills in both chambers at once so the two sides can move in parallel.']},

/* ---- the nine deaths ---- */
{id:'d-nosponsor',tone:'die',tag:TAG(4090,2650,282,-28.07),eyebrow:'The Bill Dies',title:'No Sponsor',
 body:['This is the death almost no one sees, because it happens before there is a bill to track. An idea with no member of Congress willing to introduce it never gets a number and never enters the record.',
 'Members weigh whether an idea helps them, fits their district, or costs them something with leadership before they agree to carry it.']},
{id:'d-ignored',tone:'die',tag:TAG(3956,2588,487,-18.03),eyebrow:'The Bill Dies',title:'Ignored by Committee',
 body:['The most common ending. The chair simply never puts the bill on the agenda. No hearing, no markup, no vote, no fingerprints. The old name for it is pigeonholing.',
 'Because there is no vote, no member is ever on record as having killed it, which is part of why the practice survives.']},
{id:'d-neverleaves',tone:'die',tag:TAG(3907,2477,528,-8.0),eyebrow:'The Bill Dies',title:'Never Leaves Committee',
 body:['The bill gets a hearing, maybe even a markup, and then stalls. Negotiations drag, the calendar fills, and the two year Congress ends.',
 'Everything still in committee dies at that point. Starting over in the next Congress means a new number and the whole process again.']},
{id:'d-failscomm',tone:'die',tag:TAG(3922,2356,487,2.0),eyebrow:'The Bill Dies',title:'Fails Committee Vote',
 body:['The committee votes and the bill loses. This is rarer than it sounds, because chairs control the agenda and do not usually schedule a vote they expect to lose.',
 'When it does happen it is often deliberate: a public vote that puts every member on the record is sometimes the point.']},
{id:'d-neversched',tone:'die',tag:TAG(3984,2249,384,11.96),eyebrow:'The Bill Dies',title:'Never Scheduled',
 body:['The bill survived committee and then never reaches the floor. In the House the Speaker and the Rules Committee control the calendar. In the Senate the majority leader does.',
 'A bill with enough votes to pass can still die here, because leadership decides what gets a vote at all.']},
{id:'d-filibuster',tone:'die',tag:TAG(4064,2163,282,21.95),eyebrow:'The Bill Dies',title:'Filibuster',
 body:['A Senate only death. Debate does not end until sixty senators vote for cloture, so forty one senators can stop a bill that a majority supports.',
 'The modern version rarely involves anyone talking for hours. Leadership counts to sixty, comes up short, and moves on to something else.'],
 note:['What it does not cover','Cloture on nominations now takes a simple majority, and budget reconciliation bills cannot be filibustered at all.']},
{id:'d-failsfloor',tone:'die',tag:TAG(4057,2041,405,32.0),eyebrow:'The Bill Dies',title:'Fails Floor Vote',
 body:['The chamber votes it down. This is the death students expect to be common and it is not, because leaders pull bills rather than lose them in public.',
 'A floor defeat is usually a sign that leadership lost control of its own members.']},
{id:'d-noreconcile',tone:'die',tag:TAG(4117,1946,425,41.95),eyebrow:'The Bill Dies',title:'No Reconciliation',
 body:['Both chambers passed a bill, but not the same bill, and they cannot agree on one text. Identical passage is constitutionally required, so two near misses add up to nothing.',
 'This is where a bill can die after clearing every other gate in both chambers.']},
{id:'d-veto',tone:'die',tag:TAG(4201,1870,425,51.93),eyebrow:'The Bill Dies',title:'Presidential Veto',
 body:['The president returns the bill with objections, or pockets it after Congress adjourns. Congress can override with two thirds of both chambers, which rarely happens.',
 'The veto is most powerful as a threat. Bills get rewritten to avoid one long before they reach the president\u2019s desk.']},
{id:'d-skull',tone:'die',rect:R(4370,2090,4900,2882),eyebrow:'The Bill Dies',title:'Nine Ways Out',
 body:['Every arrow on this chart that leaves a decision gate through a NO ends here. Nine separate exits, and a bill has to survive all of them in order.',
 'This is the argument the framers were making. A system with this many veto points is slow and frustrating by design, because the alternative is a national government that can change course quickly whenever a temporary majority wants it to.']}
];

/* ---------- build overlays ---------- */
const frameE=document.getElementById('frame-explore');
function place(el,n){
  if(n.tag){
    el.style.left=n.tag.cx+'%';el.style.top=n.tag.cy+'%';
    el.style.width=n.tag.w+'%';el.style.height=n.tag.h+'%';
    el.style.transform='translate(-50%,-50%) rotate('+n.tag.ang+'deg)';

    el.style.left=n.rect.l+'%';el.style.top=n.rect.t+'%';
    el.style.width=n.rect.w+'%';el.style.height=n.rect.h+'%';
    if(n.round) el.classList.add('round');
  }
}
NODES.forEach(n=>{
  const b=document.createElement('button');
  b.className='hot';b.style.setProperty('--tone','var(--'+n.tone+')');
  b.setAttribute('aria-label',n.title);
  b.dataset.id=n.id;
  place(b,n);
  b.addEventListener('click',()=>openDialog(n,b));
  frameE.appendChild(b);
});

/* ---------- dialog ---------- */
const backdrop=document.getElementById('backdrop'),dialog=document.getElementById('dialog');
let lastTrigger=null;
function openDialog(n,trigger){
  lastTrigger=trigger||null;
  dialog.style.setProperty('--tone','var(--'+n.tone+')');
  document.getElementById('dlg-eyebrow').textContent=n.eyebrow;
  document.getElementById('dlg-title').textContent=n.title;
  const body=document.getElementById('dlg-body');
  body.innerHTML='';
  n.body.forEach(t=>{const p=document.createElement('p');p.textContent=t;body.appendChild(p);});
  if(n.note){
    const d=document.createElement('div');d.className='note';
    const b=document.createElement('b');b.textContent=n.note[0];
    d.appendChild(b);d.appendChild(document.createTextNode(n.note[1]));
    body.appendChild(d);
  }
  backdrop.classList.add('open');
  if(trigger) trigger.classList.add('open');
  dialog.focus();
}
function closeDialog(){
  backdrop.classList.remove('open');
  document.querySelectorAll('.hot.open').forEach(h=>h.classList.remove('open'));
  if(lastTrigger) lastTrigger.focus();
}
document.getElementById('dlg-close').addEventListener('click',closeDialog);
backdrop.addEventListener('mousedown',e=>{if(e.target===backdrop)closeDialog();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&backdrop.classList.contains('open'))closeDialog();});

/* ---------- tabs ---------- */
const views={explore:document.getElementById('view-explore'),play:document.getElementById('view-play')};
const tabs={explore:document.getElementById('tab-explore'),play:document.getElementById('tab-play')};
function show(which){
  Object.keys(views).forEach(k=>{
    views[k].classList.toggle('active',k===which);
    tabs[k].setAttribute('aria-selected',k===which);
  });
  const playing=which==='play';
  document.getElementById('score').hidden=!playing;
  document.getElementById('reset').hidden=!playing;
  document.getElementById('hint').textContent=playing
    ? 'Drag each term onto a blurred slot, or tap a term and then tap its slot.'
    : 'Hover any step to highlight it. Click it for the detail the chart leaves out.';
  fit();
}
tabs.explore.addEventListener('click',()=>show('explore'));
tabs.play.addEventListener('click',()=>show('play'));

/* ---------- fit to screen ---------- */
const zoomBtn=document.getElementById('zoom');
zoomBtn.addEventListener('click',()=>{
  document.body.classList.toggle('fit');
  zoomBtn.textContent=document.body.classList.contains('fit')?'Full size':'Fit to screen';
  fit();
});
function fit(){
  document.querySelectorAll('.stage').forEach(st=>{
    const f=st.querySelector('.frame');
    if(!document.body.classList.contains('fit')){f.style.width='100%';return;}
    const availW=st.clientWidth-12, availH=st.clientHeight-12;
    f.style.width=Math.max(320,Math.min(availW,availH*AR))+'px';
  });
}
new ResizeObserver(fit).observe(document.querySelector('main'));
window.addEventListener('resize',fit);

q3U3GvJ/4tg5OBWVKhOde+yU/i0mBAWGa78X0S5uxb6s9j01V96GmTwFX+UPDs0RL5jbKVqZJC/ijHCf5FPhrz73asxFMvHPPRCgHtF7sP/AZjsWia3MTZxAAAAAElFTkSuQmCC"};
const TERMS=[
 ['step1','Idea Becomes a Bill'],['step2','Bill Introduction'],
 ['step3','Referred to Committee'],['step4','Committee Review'],['step5','Committee Vote'],
 ['step6','Scheduled for Debate'],['step7','Debate and Amendments'],['step8','Floor Vote'],
 ['step9','Reconciliation'],['step10','Presidential Decision']
];
const framePlay=document.getElementById('frame-play'),tray=document.getElementById('tray');
let placedCount=0,firstTry=0,tried={},picked=null;

function buildPlay(){
  framePlay.innerHTML='';tray.innerHTML='';
  placedCount=0;firstTry=0;tried={};picked=null;
  document.getElementById('placed').textContent='0';
  document.getElementById('finish').classList.remove('open');
  Object.keys(SLOTS).forEach(id=>{
    const g=SLOTS[id];
    const s=document.createElement('button');
    s.className='slot';s.dataset.slot=id;
    s.style.left=g.l+'%';s.style.top=g.t+'%';s.style.width=g.w+'%';s.style.height=g.h+'%';
    s.setAttribute('aria-label','Hidden step name');
    s.innerHTML='<span class="patch" style="background-image:url('+PATCHES[id]+')"></span><span class="ring"></span><span class="tick"></span>';
    s.addEventListener('click',()=>{ if(picked) drop(picked,s); });
    framePlay.appendChild(s);
  });
  const hint=document.createElement('p');hint.className='trayhint';
  hint.textContent='Ten step names are hidden. Put each one back where it belongs.';
  tray.appendChild(hint);
  TERMS.map(t=>({t,r:Math.random()})).sort((a,b)=>a.r-b.r).forEach(o=>{
    const c=document.createElement('button');
    c.className='chip';c.dataset.for=o.t[0];c.textContent=o.t[1];
    c.addEventListener('pointerdown',startDrag);
    tray.appendChild(c);
  });
}

function drop(chip,slot){
  const ok=chip.dataset.for===slot.dataset.slot;
  const id=slot.dataset.slot;
  if(ok){
    slot.classList.add('solved','hit');
    slot.setAttribute('aria-label',chip.textContent+', correct');
    if(!tried[id]) firstTry++;
    placedCount++;
    document.getElementById('placed').textContent=placedCount;
    chip.remove();
    clearPick();
    if(placedCount===TERMS.length) setTimeout(endGame,650);
  }else{
    tried[id]=true;tried[chip.dataset.for]=true;
    slot.classList.add('wrong');
    setTimeout(()=>slot.classList.remove('wrong'),400);
  }
}
function clearPick(){
  if(picked) picked.classList.remove('picked');
  picked=null;
  document.querySelectorAll('.slot.armed').forEach(s=>s.classList.remove('armed'));
}

/* pointer drag: chips are not selectable, and cancel counts as a release */
let ghost=null,dragChip=null,moved=false,startX=0,startY=0;
function startDrag(e){
  if(e.button!==undefined&&e.button!==0) return;
  e.preventDefault();
  dragChip=e.currentTarget;moved=false;startX=e.clientX;startY=e.clientY;
  dragChip.setPointerCapture(e.pointerId);
  dragChip.addEventListener('pointermove',onMove);
  dragChip.addEventListener('pointerup',onUp);
  dragChip.addEventListener('pointercancel',onUp);
  dragChip.addEventListener('lostpointercapture',onUp);
}
function onMove(e){
  if(!dragChip) return;
  if(!moved&&Math.hypot(e.clientX-startX,e.clientY-startY)<6) return;
  if(!moved){
    moved=true;
    ghost=dragChip.cloneNode(true);ghost.classList.add('ghost');
    document.body.appendChild(ghost);
    dragChip.classList.add('placing');
  }
  ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
  const s=nearestSlot(e.clientX,e.clientY);
  document.querySelectorAll('.slot.armed').forEach(x=>x.classList.remove('armed'));
  if(s) s.classList.add('armed');
}
function onUp(e){
  if(!dragChip) return;
  const chip=dragChip,wasMoved=moved;
  dragChip.removeEventListener('pointermove',onMove);
  dragChip.removeEventListener('pointerup',onUp);
  dragChip.removeEventListener('pointercancel',onUp);
  dragChip.removeEventListener('lostpointercapture',onUp);
  dragChip=null;moved=false;
  chip.classList.remove('placing');
  if(ghost){ghost.remove();ghost=null;}
  document.querySelectorAll('.slot.armed').forEach(x=>x.classList.remove('armed'));
  if(wasMoved){
    const s=nearestSlot(e.clientX,e.clientY);
    if(s) drop(chip,s);
  }else{
    if(picked===chip){clearPick();}
    else{clearPick();picked=chip;chip.classList.add('picked');}
  }
}
/* nearest open slot within a tolerance, which is far more forgiving than a strict hit test */
function nearestSlot(x,y){
  const tol=framePlay.getBoundingClientRect().width*0.05;
  let best=null,bd=Infinity;
  document.querySelectorAll('#frame-play .slot:not(.solved)').forEach(s=>{
    const r=s.getBoundingClientRect();
    const dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom);
    const d=Math.hypot(dx,dy);
    if(d<bd){bd=d;best=s;}
  });
  return bd<=tol?best:null;
}

function endGame(){
  document.getElementById('finalscore').textContent=firstTry+' / 10';
  const msgs=[
    'Ten for ten. You know the path cold.',
    'Strong. Look back at the two you missed and find the gate that kills them.',
    'Worth another run. The committee steps are the ones most people scramble.'
  ];
  document.getElementById('finalline').textContent=firstTry===10?msgs[0]:(firstTry>=7?msgs[1]:msgs[2]);
  document.getElementById('finish').classList.add('open');
}
document.getElementById('reset').addEventListener('click',buildPlay);
document.getElementById('again').addEventListener('click',buildPlay);
document.getElementById('finish').addEventListener('mousedown',e=>{
  if(e.target.id==='finish') document.getElementById('finish').classList.remove('open');
});
document.getElementById('toexplore').addEventListener('click',()=>{
  document.getElementById('finish').classList.remove('open');show('explore');
});

buildPlay();
fit();
</script>
