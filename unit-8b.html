<title>Levels of Government: Interactive Diagram</title>

<style>
  :root{
    --parchment:#F7F4EE;--paper:#FFFFFF;--sand:#F2E3C8;--line:#DED6C9;
    --ink:#2B2723;--muted:#6E655D;--brick:#9E413C;--brick-dark:#7C3230;
    --green:#6C8B5F;--green-dark:#506946;--clay:#A6423C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--parchment);color:var(--ink);font-family:'Lora',Georgia,serif;
    -webkit-text-size-adjust:100%;touch-action:manipulation;}
  .wrap{max-width:1180px;margin:0 auto;padding:14px 14px 28px;}

  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 2px 10px;}
  .bar h1{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
    letter-spacing:.06em;font-size:1.05rem;margin:0;white-space:nowrap;}
  .dashes{display:flex;gap:4px;align-items:center;}
  .dashes i{display:block;width:12px;height:3px;background:var(--brick);opacity:.85;}
  .dashes i:nth-child(2){opacity:.7}.dashes i:nth-child(3){opacity:.55}
  .dashes i:nth-child(4){opacity:.4}.dashes i:nth-child(5){opacity:.25}
  .spacer{flex:1 1 auto;}
  .count{font-family:'Oswald',sans-serif;font-size:.82rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;}
  .count b{color:var(--ink);font-weight:600;}
  button{font-family:'Oswald',sans-serif;}
  .btn{appearance:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
    padding:7px 13px;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;
    border-radius:3px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;}
  .btn:hover{border-color:var(--brick);color:var(--brick);}
  .btn:focus-visible{outline:2.5px solid var(--brick);outline-offset:2px;}
  .tabs{display:flex;border:1.5px solid var(--line);border-radius:3px;overflow:hidden;background:var(--paper);}
  .tab{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
    padding:7px 12px;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;
    border-right:1.5px solid var(--line);transition:background .15s,color .15s;}
  .tab:last-child{border-right:0;}
  .tab:hover{color:var(--brick);}
  .tab[aria-selected="true"]{background:var(--brick);color:#fff;}
  .tab:focus-visible{outline:2.5px solid var(--ink);outline-offset:-3px;}

  /* question panel, level 2 only */
  .prompt{border:1.5px solid var(--line);border-left:5px solid var(--brick);background:var(--paper);
    border-radius:4px;padding:11px 15px 13px;margin:0 0 10px;}
  .prompt[hidden]{display:none;}
  .prompt .qn{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.09em;
    font-size:.7rem;color:var(--brick-dark);margin-bottom:4px;}
  .prompt .qt{font-size:1.02rem;line-height:1.4;}

    background-size:100% 100%;background-repeat:no-repeat;
    container-type:inline-size;user-select:none;-webkit-user-select:none;}
  .slot{position:absolute;padding:0;border:2px dashed transparent;background:transparent;
    cursor:pointer;transition:background .16s,border-color .16s,box-shadow .16s;
    -webkit-tap-highlight-color:transparent;}
  .slot:focus-visible{outline:3px solid var(--brick);outline-offset:2px;}
  .slot.armed{border-color:rgba(43,39,35,.4);}
  .slot.hot{border-color:var(--ink);background:rgba(255,255,255,.4);
    box-shadow:0 0 0 calc(0.3cqw) rgba(43,39,35,.14);}
  .slot.wrong{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  /* level 1 blur patches */
  .slot.frost{border-radius:3px;}
  .frostpatch{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;
    pointer-events:none;transition:opacity .45s ease;}
  .slot.frost.hot .frostpatch{filter:brightness(1.1) contrast(.95);}
  .slot.done .frostpatch{opacity:0;}
  .slot.done{cursor:default;}
  .slot.ringok{animation:ringok 1.6s ease forwards;}
  .slot.ringrev{animation:ringrev 1.2s ease forwards;}
  @keyframes ringok{0%{border-color:var(--green-dark);box-shadow:0 0 0 3px rgba(108,139,95,.6)}
    60%{border-color:var(--green-dark);box-shadow:0 0 0 3px rgba(108,139,95,.35)}
    100%{border-color:transparent;box-shadow:none}}
  @keyframes ringrev{0%{border-color:var(--muted);box-shadow:0 0 0 3px rgba(110,101,93,.45)}
    100%{border-color:transparent;box-shadow:none}}

  /* level 2 clickable nodes */
  .node{position:absolute;border:3px solid transparent;border-radius:50%;background:transparent;
    cursor:pointer;padding:0;transition:border-color .15s,background .15s,box-shadow .15s;
    -webkit-tap-highlight-color:transparent;}
  .node:hover{border-color:rgba(43,39,35,.5);background:rgba(255,255,255,.22);}
  .node:focus-visible{outline:3px solid var(--brick);outline-offset:2px;}
  .node.hitok{animation:nodeok 1.4s ease forwards;}
  .node.hitbad{animation:nodebad .5s ease;}
  .node.solved{border-color:rgba(80,105,70,.55);background:rgba(108,139,95,.16);cursor:default;}
  @keyframes nodeok{0%{border-color:var(--green-dark);background:rgba(108,139,95,.5)}
    100%{border-color:rgba(80,105,70,.55);background:rgba(108,139,95,.16)}}
  @keyframes nodebad{0%,100%{border-color:var(--clay);background:rgba(166,66,60,.14);transform:translateX(0)}
    25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  .status{min-height:2.1em;margin:10px 2px 4px;font-size:.94rem;line-height:1.45;color:var(--muted);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .status strong{color:var(--ink);font-weight:600;}
  .status.good strong{color:var(--green-dark);}
  .status.bad strong{color:var(--clay);}
  .nextbtn{appearance:none;border:1.5px solid var(--green-dark);background:var(--green);color:#fff;
    padding:6px 13px;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
    border-radius:3px;cursor:pointer;}
  .nextbtn:hover{background:var(--green-dark);}
  .nextbtn:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;}

  .tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px;}
  .tray[hidden]{display:none;}
  .card{position:relative;background:var(--paper);border:1.5px solid var(--line);
    border-left:5px solid var(--sand);border-radius:4px;padding:9px 11px 10px;cursor:grab;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;
    transition:border-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;}
  .card:hover{border-color:#c9bfae;border-left-color:var(--brick);box-shadow:0 2px 7px rgba(43,39,35,.09);}
  .card:focus-visible{outline:3px solid var(--brick);outline-offset:2px;}
  .card.picked{border-color:var(--brick);border-left-color:var(--brick);background:#FDF7F1;
    box-shadow:0 0 0 2px rgba(158,65,60,.22);}
  .card.dragging{opacity:.32;}
  .card.gone{display:none;}
  .card .t{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
    letter-spacing:.05em;font-size:.77rem;color:var(--brick-dark);margin-bottom:3px;}
  .card .d{font-size:.85rem;line-height:1.35;}
  .ghost{position:fixed;z-index:999;pointer-events:none;width:240px;
    transform:translate(-50%,-50%) rotate(-1.2deg);box-shadow:0 10px 24px rgba(43,39,35,.3);opacity:.97;}

  .recap{margin-top:14px;border:1.5px solid var(--line);border-top:4px solid var(--green);
    border-radius:4px;background:var(--paper);padding:14px 16px 16px;}
  .recap[hidden]{display:none;}
  .recap h2{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.07em;
    font-size:.92rem;margin:0 0 9px;}
  .recap ul{margin:0;padding-left:1.1em;}
  .recap li{font-size:.9rem;line-height:1.5;margin-bottom:5px;}
  .recap li span{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:.75rem;
    letter-spacing:.05em;color:var(--brick-dark);}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  @media (max-width:640px){
    .wrap{padding:10px 10px 22px;}
    .bar h1{font-size:.88rem;}
    .prompt .qt{font-size:.94rem;}
    .tray{grid-template-columns:1fr 1fr;gap:7px;}
    .card{padding:7px 8px 8px;}
    .card .d{font-size:.76rem;}
    .card .t{font-size:.7rem;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>

  function distToRect(x,y,r){
    var dx=Math.max(r.left-x,0,x-r.right), dy=Math.max(r.top-y,0,y-r.bottom);
    return Math.sqrt(dx*dx+dy*dy);

  /* Nearest open target within a tolerance ring, so a near miss still lands. */
  function hitSlot(x,y){

    for (var k in slots){

      if (d<bestD){ bestD=d; best=s; }

    var tol=Math.max(30, stage.getBoundingClientRect().width*0.05);
    return bestD<=tol?best:null;
  }

        document.body.appendChild(ghost);
        card.classList.add("dragging");
      }
      ghost.style.left=e.clientX+"px"; ghost.style.top=e.clientY+"px";
      var over=hitSlot(e.clientX,e.clientY);
      if (over!==lastHot){ setHot(over); lastHot=over; }
    });

    card.addEventListener("pointerup",function(e){
      if (id===null) return;
      var pid=id; id=null;
      try { card.releasePointerCapture(pid); } catch(err){}
      card.classList.remove("dragging");
      if (ghost){ ghost.remove(); ghost=null; }
      setHot(null);
      if (!moving){ pick(card,!card.classList.contains("picked")); return; }
      var target=hitSlot(e.clientX,e.clientY);
      lastHot=null;
      if (target) tryPlace(item(card.dataset.key),target);
      else { clearPick(); say(HINT1,""); }
    });

    /* A cancelled pointer used to drop the card with no feedback, which reads
       as a correct answer bouncing back. Treat it as a clean release. */
    function abort(){
      if (id===null) return;
      id=null;
      card.classList.remove("dragging");
      if (ghost){ ghost.remove(); ghost=null; }
      setHot(null); lastHot=null;
      if (moving){ clearPick(); say(HINT1,""); }
    }
    card.addEventListener("pointercancel",abort);
    card.addEventListener("lostpointercapture",abort);
    card.addEventListener("dragstart",function(e){ e.preventDefault(); });

    card.addEventListener("keydown",function(e){
      if (e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(card,!card.classList.contains("picked")); }
    });
  }

  function pick(card,on){
    clearPick();
    if (!on) return;
    picked=item(card.dataset.key);
    card.classList.add("picked");
    for (var k in slots) if (!slots[k].dataset.done) slots[k].classList.add("armed");
    say("Holding <strong>"+picked.title+"</strong>. Now choose a label on the diagram.","");
  }

  function clearPick(){
    picked=null;
    for (var k in cards) cards[k].classList.remove("picked");
    for (var s in slots) slots[s].classList.remove("armed");
  }

  function tryPlace(d,slot){
    if (!d) return;
    if (slot.dataset.key===d.key){
      fillSlot(slots[d.key],d,false);
      cards[d.key].classList.add("gone");
      placed++; clearPick(); updateCount();
      if (placed===L1.length){
        showRecap(1);
        say("All twelve labeled. "+(misses===0?"<strong>No misses.</strong> ":"Finished with <strong>"+misses+" miss"+(misses===1?"":"es")+"</strong>. ")+
            "Every branch repeats at all three levels.","good");
        var b=document.createElement("button");
        b.className="nextbtn"; b.type="button"; b.textContent="Go to Level 2";
        b.addEventListener("click",function(){ setLevel(2); });
        status.appendChild(b);
      } else {
        say("<strong>"+d.title+"</strong> is right. "+d.text,"good");
      }
    } else {
      misses++;
      slot.classList.remove("wrong"); void slot.offsetWidth; slot.classList.add("wrong");
      clearPick();
      say("Not there. <strong>"+d.title+"</strong> belongs somewhere else on the chart.","bad");
    }
  }

  function fillSlot(slot,d,revealed){
    slot.dataset.done="1"; slot.tabIndex=-1;
    slot.setAttribute("aria-label",d.title+". "+d.text);
    slot.classList.remove("armed","hot");
    slot.classList.add("done",revealed?"ringrev":"ringok");
  }

  /* ---------------- level 2: answer with the chart ---------------- */

  function buildL2(){
    stage.querySelectorAll(".slot,.node").forEach(function(n){ n.remove(); });
    slots={}; nodes={};
    NODES.forEach(function(n){
      var b=document.createElement("button");
      b.type="button"; b.className="node"; b.dataset.key=n.key;
      place(b,n.box);
      b.setAttribute("aria-label",n.name);
      stage.appendChild(b); nodes[n.key]=b;
      b.addEventListener("click",function(){ answer(n.key); });
    });
    tray.hidden=true; tray.innerHTML="";
    order=shuffle(QUESTIONS.map(function(q){ return q.key; }));
    qi=0; answered=0; qmiss=0; locked=false;
    prompt.hidden=false;
    askQuestion();
  }

  function askQuestion(){
    var q=qOf(order[qi]);
    qnum.textContent="Question "+(qi+1)+" of "+order.length;
    qtext.textContent=q.q;
    updateCount();
    say(HINT2,"");
  }

  function answer(key){
    if (level!==2||locked) return;
    var want=order[qi], q=qOf(want);
    if (key===want){
      locked=true; answered++; updateCount();
      var el=nodes[key];
      el.classList.remove("hitok"); void el.offsetWidth; el.classList.add("hitok","solved");
      say("<strong>"+node(want).name.replace(/^the /,"The ")+".</strong> "+q.why,"good");
      nextControl();
    } else {
      qmiss++;
      var bad=nodes[key];
      bad.classList.remove("hitbad"); void bad.offsetWidth; bad.classList.add("hitbad");
      say("That is <strong>"+node(key).name+"</strong>. Look again at which level and which branch the question is describing.","bad");
    }
  }

  function nextControl(){
    var b=document.createElement("button");
    b.className="nextbtn"; b.type="button";
    b.textContent=(qi+1<order.length)?"Next question":"See results";
    b.addEventListener("click",function(){
      if (qi+1<order.length){ qi++; locked=false; askQuestion(); }
      else {
        showRecap(2);
        say("All "+order.length+" answered. "+(qmiss===0?"<strong>No misses.</strong>":"Finished with <strong>"+qmiss+" miss"+(qmiss===1?"":"es")+"</strong>.")+
            " The same three branches appear at all three levels, doing the same kind of work on a smaller scale.","good");
      }
    });
    status.appendChild(b);
  }

  /* ---------------- shared ---------------- */

  function updateCount(){
    count.innerHTML = (level===1)
      ? "<b>"+placed+"</b> of "+L1.length+" labeled"
      : "<b>"+answered+"</b> of "+order.length+" answered";
  }

  function showRecap(n){
    recapUL.innerHTML="";
    if (n===1){
      recapH.textContent="What each label means";
      L1.forEach(function(d){
        var li=document.createElement("li"), s=document.createElement("span");
        s.textContent=d.title+" ";
        li.appendChild(s); li.appendChild(document.createTextNode(d.recap));
        recapUL.appendChild(li);
      });
    } else {
      recapH.textContent="Who handles what";
      QUESTIONS.forEach(function(q){
        var li=document.createElement("li"), s=document.createElement("span");
        s.textContent=node(q.key).name.replace(/^the /,"")+" ";
        li.appendChild(s); li.appendChild(document.createTextNode(q.why));
        recapUL.appendChild(li);
      });
    }
    recap.hidden=false;
  }

  revealBtn.addEventListener("click",function(){
    if (level===1){
      clearPick();
      L1.forEach(function(d){
        if (!slots[d.key].dataset.done){
          fillSlot(slots[d.key],d,true);
          if (cards[d.key]) cards[d.key].classList.add("gone");
        }
      });
      placed=L1.length; updateCount(); showRecap(1);
      say("Answers shown. The printed labels are back on the chart.","");
    } else {
      if (locked) return;
      var want=order[qi];
      var el=nodes[want];
      el.classList.add("solved");
      locked=true; answered++; qmiss++; updateCount();
      say("The answer is <strong>"+node(want).name+"</strong>. "+qOf(want).why,"");
      nextControl();
    }
  });

  document.getElementById("resetBtn").addEventListener("click",function(){ setLevel(level); });
  tab1.addEventListener("click",function(){ setLevel(1); });
  tab2.addEventListener("click",function(){ setLevel(2); });

  function setLevel(n){
    level=n;
    placed=0; misses=0; picked=null;
    recap.hidden=true;
    tab1.setAttribute("aria-selected",n===1?"true":"false");
    tab2.setAttribute("aria-selected",n===2?"true":"false");
    if (n===1){
      title.textContent="Label the Diagram";
      revealBtn.textContent="Show answers";
      prompt.hidden=true;
      buildL1(); updateCount(); say(HINT1,"");
    } else {
      title.textContent="Who Does It";
      revealBtn.textContent="Show answer";
      buildL2();
    }
  }

  document.addEventListener("keydown",function(e){ if (e.key==="Escape") clearPick(); });

  setLevel(1);
})();
</script>
</body>
</html>
